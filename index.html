
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AITEL">
<meta name="description" content="AITEL Messenger | ارتباط، ساده‌تر از همیشه">
<title>AITEL | ایتل</title>
<link rel="apple-touch-icon" id="appleIcon">
<link rel="icon" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#f4f7ff;
 --panel:#fff;
 --text:#17243d;
 --muted:#8793a8;
 --line:#e8edf6;
 --primary:#2878ed;
 --primary2:#55a1ff;
 --soft:#eaf3ff;
 --green:#20b77a;
 --danger:#e45163;
 --shadow:0 10px 35px rgba(30,75,140,.09);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 background:var(--bg);
 color:var(--text);
 font-family:Vazirmatn,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.5;cursor:not-allowed}
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{
 width:370px;max-width:100%;background:var(--panel);
 border-left:1px solid var(--line);display:flex;flex-direction:column;
}
.top{
 padding:17px 18px 13px;display:flex;align-items:center;
 justify-content:space-between;
}
.brand{
 font-family:"Space Grotesk",sans-serif;font-size:27px;
 font-weight:700;color:var(--primary);letter-spacing:-1.5px;
}
.version{font-size:10px;color:var(--muted);margin-right:6px}
.brandline{display:flex;align-items:center;gap:9px}
.brandmark{
 width:38px;height:38px;border-radius:13px;
 background:linear-gradient(145deg,#2676ed,#65adff);
 display:grid;place-items:center;box-shadow:0 5px 13px #2878ed30;
}
.brandmark svg{width:25px;height:25px}
.iconbtn{
 width:40px;height:40px;border-radius:14px;background:#f1f5fc;
 color:#52627a;display:grid;place-items:center;font-size:19px;
}
.search{padding:0 15px 13px}
.search input{
 width:100%;border:0;outline:0;background:#f2f5fa;
 border-radius:14px;padding:13px 15px;font-size:14px;
}
.tabs{display:flex;padding:0 12px;gap:5px;border-bottom:1px solid var(--line)}
.tab{
 flex:1;padding:12px 4px;background:none;color:var(--muted);font-size:12px;
}
.tab.active{color:var(--primary);border-bottom:2px solid var(--primary);font-weight:800}
.list{overflow:auto;flex:1;padding:7px}
.item{
 display:flex;align-items:center;gap:11px;padding:11px;
 border-radius:15px;cursor:pointer;
}
.item:hover,.item.active{background:#edf4ff}
.avatar{
 width:48px;height:48px;flex-shrink:0;border-radius:17px;
 background:linear-gradient(135deg,#2878ed,#8cc4ff);
 display:grid;place-items:center;color:white;font-size:21px;
 font-weight:800;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.iteminfo{flex:1;min-width:0}
.itemname{
 font-size:14px;font-weight:800;display:flex;align-items:center;
 gap:5px;min-width:0;
}
.preview{
 font-size:11px;color:var(--muted);white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;margin-top:4px;
}
.badgecount{
 background:var(--primary);color:white;border-radius:20px;
 min-width:21px;height:21px;padding:0 6px;
 display:grid;place-items:center;font-size:10px;
}
.verified{
 display:inline-grid;place-items:center;width:16px;height:16px;
 border-radius:50%;background:#2878ed;color:white;font-size:10px;
 flex-shrink:0;
}
.chatarea{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.empty{margin:auto;text-align:center;color:var(--muted)}
.empty .big{font-size:65px;color:#77aaf2}
.chathead{
 height:72px;background:#fff;border-bottom:1px solid var(--line);
 display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;
}
.chathead .name{font-weight:800;display:flex;align-items:center;gap:5px}
.chathead .sub{font-size:11px;color:var(--muted)}
.chathead .avatar{cursor:pointer}
.messages{
 flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;
 gap:10px;background-color:#f5f8fd;scroll-behavior:smooth;
}
.msg{
 max-width:min(82%,540px);padding:10px 13px;border-radius:16px;
 background:white;box-shadow:0 2px 8px #00000008;
 align-self:flex-start;overflow-wrap:anywhere;position:relative;
}
.msg.mine{
 align-self:flex-end;background:#e5f0ff;border-bottom-right-radius:5px;
}
.msg .sender{font-size:11px;color:var(--primary);font-weight:800;margin-bottom:5px}
.msg .time{font-size:9px;color:#929db0;text-align:left;margin-top:6px}
.msg .ticks{color:var(--primary);margin-right:4px}
.msg .edited{font-size:9px;color:#8b99ad;margin-right:4px}
.msg.deleted{color:#8b96a8;font-style:italic}
.msg-actions{
 display:flex;justify-content:flex-end;gap:5px;margin-top:7px;
 border-top:1px solid #00000008;padding-top:6px;
}
.msg-actions button{
 background:transparent;color:#74839a;font-size:10px;padding:3px 5px;
}
.msg-actions button:hover{color:var(--primary)}
.replyquote{
 border-right:3px solid var(--primary);background:#edf4ff;
 border-radius:8px;padding:7px 9px;margin-bottom:7px;
 font-size:11px;cursor:pointer;color:#50627d;
}
.replyquote b{display:block;color:var(--primary);margin-bottom:3px}
.replyquote span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.replybar{
 display:flex;align-items:center;gap:10px;padding:9px 14px;
 background:#f0f6ff;border-top:1px solid var(--line);
}
.replybar .replytext{flex:1;min-width:0;font-size:11px;color:#66758d}
.replybar b{display:block;color:var(--primary);margin-bottom:2px}
.replybar button{background:none;color:#8290a5;font-size:18px}
.composer{
 padding:12px 15px;background:white;border-top:1px solid var(--line);
 display:flex;gap:9px;align-items:center;
}
.composer input{
 flex:1;min-width:0;border:0;outline:0;background:#f1f5fa;
 border-radius:20px;padding:13px 17px;font-size:16px;
}
.send{
 width:46px;height:46px;border-radius:16px;
 background:linear-gradient(135deg,#2878ed,#559fff);
 color:white;font-size:19px;box-shadow:0 5px 13px #2878ed30;
}
.login{
 position:fixed;inset:0;background:var(--bg);z-index:20;
 display:flex;align-items:center;justify-content:center;padding:20px;
}
.loginbox{
 background:white;border-radius:28px;padding:34px 25px;
 width:min(390px,100%);text-align:center;box-shadow:var(--shadow);
}
.loginlogo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:15px}
.loginlogo .brandmark{width:58px;height:58px;border-radius:19px}
.loginlogo .brandmark svg{width:37px;height:37px}
.loginlogo span{font-family:"Space Grotesk";font-size:42px;font-weight:700;color:var(--primary)}
.google{
 width:100%;padding:14px;border-radius:14px;background:var(--primary);
 color:white;font-weight:800;margin-top:20px;
}
.hidden{display:none!important}
.toast{
 position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
 background:#17243d;color:white;padding:12px 18px;border-radius:13px;
 font-size:12px;z-index:99;box-shadow:var(--shadow);
 max-width:90%;text-align:center;
}
.modal{
 position:fixed;inset:0;background:#11182777;z-index:30;
 display:flex;align-items:center;justify-content:center;padding:15px;
}
.modalbox{
 width:min(480px,100%);max-height:85dvh;overflow:auto;
 background:white;border-radius:23px;padding:20px;
}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.channelcard{
 display:flex;gap:12px;align-items:center;padding:12px;
 border:1px solid var(--line);border-radius:15px;margin-bottom:9px;
}
.channelcard .details{flex:1;min-width:0}
.channelcard b{font-size:13px}
.channelcard small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.join{
 background:var(--soft);color:var(--primary);padding:8px 12px;
 border-radius:10px;font-size:11px;font-weight:800;
}
.join.joined{background:#e9f8f1;color:#159664}
.profile{padding:15px;text-align:center}
.profile .avatar{margin:auto;width:85px;height:85px;border-radius:28px}
.profile input,.profile textarea{
 width:100%;border:1px solid var(--line);border-radius:12px;
 padding:11px;margin-top:10px;outline:0;font-size:16px;
}
.primary{background:var(--primary);color:white;padding:12px 17px;border-radius:12px;font-weight:800}
.dangerbtn{background:#fff0f1;color:#d44;padding:11px 15px;border-radius:12px;font-weight:800}
.back{display:none}
.profile-action{width:100%;margin-top:10px}
@media(max-width:700px){
 .sidebar{width:100%;border:0}
 .chatarea{display:none}
 .app.chat-open .sidebar{display:none}
 .app.chat-open .chatarea{display:flex}
 .chathead{height:64px;padding:0 12px}
 .messages{padding:13px}
 .back{display:grid!important}
 .msg{max-width:88%}
}
</style>
</head>

<body>
<div class="app" id="app">
 <aside class="sidebar">
  <div class="top">
   <div class="brandline">
    <div class="brandmark" aria-label="AITEL">
     <svg viewBox="0 0 40 40" fill="none">
      <path d="M8 12.5C8 9.46 10.46 7 13.5 7H26.5C29.54 7 32 9.46 32 12.5V23.5C32 26.54 29.54 29 26.5 29H19L11 34V29.5C9.2 28.7 8 26.9 8 24.8V12.5Z" fill="white"/>
      <path d="M14 17H26M14 22H22" stroke="#2878ed" stroke-width="2.8" stroke-linecap="round"/>
     </svg>
    </div>
    <div><span class="brand">AITEL</span><span class="version">v1.1</span></div>
   </div>
   <button class="iconbtn" onclick="openChannels()">◈</button>
  </div>

  <div class="search">
   <input id="searchInput" placeholder="جست‌وجوی گفتگو، کانال یا کاربر..." oninput="renderList()">
  </div>

  <div class="tabs">
   <button class="tab active" onclick="switchTab('chats',this)">گفتگوها</button>
   <button class="tab" onclick="switchTab('channels',this)">کانال‌ها</button>
   <button class="tab" onclick="switchTab('groups',this)">گروه‌ها</button>
  </div>

  <div class="list" id="list"></div>

  <div style="padding:12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center">
   <div class="avatar" id="myAvatar" style="width:40px;height:40px" onclick="openProfile()">؟</div>
   <div style="flex:1;min-width:0" onclick="openProfile()">
    <b id="myName" style="font-size:13px">پروفایل من</b>
    <div id="myUsername" style="font-size:10px;color:var(--muted)">تنظیم حساب</div>
   </div>
   <button class="iconbtn" onclick="openProfile()">⚙</button>
  </div>
 </aside>

 <main class="chatarea" id="chatArea">
  <div class="empty">
   <div class="big">✉</div>
   <b>به ایتل خوش آمدید</b>
   <p style="font-size:12px">برای شروع یک گفتگو را انتخاب کنید.</p>
  </div>
 </main>
</div>

<div class="login hidden" id="login">
 <div class="loginbox">
  <div class="loginlogo">
   <div class="brandmark">
    <svg viewBox="0 0 40 40" fill="none">
     <path d="M8 12.5C8 9.46 10.46 7 13.5 7H26.5C29.54 7 32 9.46 32 12.5V23.5C32 26.54 29.54 29 26.5 29H19L11 34V29.5C9.2 28.7 8 26.9 8 24.8V12.5Z" fill="white"/>
     <path d="M14 17H26M14 22H22" stroke="#2878ed" stroke-width="2.8" stroke-linecap="round"/>
    </svg>
   </div>
   <span>AITEL</span>
  </div>
  <h2>ارتباط، ساده‌تر از همیشه</h2>
  <p style="color:var(--muted);font-size:13px">وارد حساب خود شوید و گفتگو را آغاز کنید.</p>
  <button class="google" onclick="loginGoogle()">ورود با حساب Google</button>
  <p style="font-size:10px;color:var(--muted);margin-top:20px">AITEL Messenger · v1.1</p>
 </div>
</div>

<div class="modal hidden" id="modal" onclick="if(event.target===this)closeModal()">
 <div class="modalbox" id="modalContent"></div>
</div>
<div class="toast hidden" id="toast"></div>

<script>
const SUPABASE_URL='https://psvesfkxtmlnjyhphsfs.supabase.co';
const SUPABASE_KEY='sb_publishable_QClWgLVOmPGwPK_kTsL5UA_L0cNqJ4H';
const SITE_URL='https://v2gurd.github.io/AITEL/';

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
 auth:{
  persistSession:true,
  autoRefreshToken:true,
  detectSessionInUrl:false,
  flowType:'pkce'
 }
});

let currentUser=null;
let myProfile=null;
let currentChat=null;
let currentTab='chats';
let myChats=[];
let channels=[];
let memberships=[];
let unreadMap={};
let realtime=null;
let messageRealtime=null;
let loadingMessages=false;
let replyTarget=null;
let messageCache=[];
let chatProfiles={};

const $=id=>document.getElementById(id);

const LOGO_SVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2878ed"/><stop offset="1" stop-color="#65adff"/></linearGradient></defs>
<rect width="100" height="100" rx="28" fill="url(#g)"/>
<path d="M19 29c0-8 6-14 14-14h34c8 0 14 6 14 14v29c0 8-6 14-14 14H47L27 86V72c-5-2-8-7-8-14V29Z" fill="white"/>
<path d="M35 40h31M35 53h23" stroke="#2878ed" stroke-width="6" stroke-linecap="round"/>
</svg>`;

function setupBrandAssets(){
 const iconUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO_SVG);
 $('favicon').href=iconUrl;
 $('appleIcon').href=iconUrl;

 const manifest={
  name:'AITEL Messenger',
  short_name:'AITEL',
  description:'ارتباط، ساده‌تر از همیشه',
  start_url:SITE_URL,
  scope:SITE_URL,
  display:'standalone',
  background_color:'#f4f7ff',
  theme_color:'#2878ed',
  icons:[{src:iconUrl,sizes:'192x192',type:'image/svg+xml',purpose:'any'}]
 };
 const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
 const link=document.createElement('link');
 link.rel='manifest';
 link.href=URL.createObjectURL(blob);
 document.head.appendChild(link);
}
setupBrandAssets();

function toast(message){
 const el=$('toast');
 el.textContent=message;
 el.classList.remove('hidden');
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3500);
}
function escapeHTML(value=''){
 return String(value).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}
function timeText(value){
 if(!value)return '';
 return new Date(value).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
}
function avatarHTML(profile){
 if(profile?.avatar_url){
  return `<img src="${escapeHTML(profile.avatar_url)}" alt="">`;
 }
 return escapeHTML((profile?.display_name||profile?.title||'ا').slice(0,1));
}
function isOfficialChannel(chatId){
 return !!channels.find(x=>x.chat_id===chatId)?.is_official;
}
function verifiedMark(){return '<span class="verified" title="تأیید شده">✓</span>'}
function showModal(html){
 $('modalContent').innerHTML=html;
 $('modal').classList.remove('hidden');
}
function closeModal(){$('modal').classList.add('hidden')}

/* ورود گوگل */
async function loginGoogle(){
 const {error}=await db.auth.signInWithOAuth({
  provider:'google',
  options:{
   redirectTo:SITE_URL,
   queryParams:{access_type:'offline',prompt:'select_account'}
  }
 });
 if(error)toast('خطا در ورود: '+error.message);
}
async function handleOAuth(){
 const params=new URLSearchParams(location.search);
 const code=params.get('code');
 if(code){
  const {error}=await db.auth.exchangeCodeForSession(code);
  if(error)toast('خطای ورود گوگل: '+error.message);
  history.replaceState({},document.title,location.pathname);
 }
}
async function boot(){
 await handleOAuth();
 const {data,error}=await db.auth.getSession();
 if(error)console.error(error);
 if(data.session){
  currentUser=data.session.user;
  await startApp();
 }else $('login').classList.remove('hidden');

 db.auth.onAuthStateChange(async(event,session)=>{
  if(session?.user&&!currentUser){
   currentUser=session.user;
   await startApp();
  }
  if(event==='SIGNED_OUT')location.reload();
 });
}

/* پروفایل */
async function loadProfile(){
 const {data,error}=await db.from('aitel_profiles')
  .select('*').eq('id',currentUser.id).maybeSingle();
 if(error){
  console.error('PROFILE ERROR:',error);
  toast('خطای دریافت پروفایل: '+error.message);
 }
 if(data)myProfile=data;
 else{
  const displayName=currentUser.user_metadata?.full_name||
   currentUser.email?.split('@')[0]||'کاربر ایتل';
  const username='user_'+currentUser.id.replaceAll('-','').slice(0,10);
  const {data:newProfile,error:insertError}=await db.from('aitel_profiles')
   .insert({id:currentUser.id,display_name:displayName,username,bio:''})
   .select().single();
  if(insertError){
   toast('ساخت پروفایل ناموفق بود: '+insertError.message);
   return;
  }
  myProfile=newProfile;
 }
 if(!myProfile)return;
 $('myName').textContent=myProfile.display_name;
 $('myUsername').textContent='@'+(myProfile.username||'');
 $('myAvatar').innerHTML=avatarHTML(myProfile);
}

/* کانال‌ها */
async function loadChannels(){
 const {data,error}=await db.from('aitel_public_channels')
  .select('*').order('created_at',{ascending:true});
 if(error){
  console.error('CHANNELS ERROR:',error);
  toast('دریافت کانال‌ها ناموفق بود: '+error.message);
  channels=[];
 }else channels=data||[];

 const {data:official,error:officialError}=await db.from('aitel_chats')
  .select('id,title,description,is_official,is_verified,chat_type')
  .eq('is_official',true).limit(1).maybeSingle();

 if(officialError)console.warn('OFFICIAL CHANNEL:',officialError.message);
 if(official){
  const existing=channels.find(c=>c.chat_id===official.id);
  if(existing){
   existing.is_official=true;
   existing.is_verified=true;
   existing.title=official.title||existing.title;
  }else{
   channels.unshift({
    chat_id:official.id,title:official.title||'کانال رسمی ایتل',
    description:official.description||'کانال رسمی پیام‌رسان ایتل',
    icon:'✳️',target_members:5000,is_official:true,is_verified:true
   });
  }
 }
}

/* عضویت‌ها */
async function loadMemberships(){
 const {data,error}=await db.from('aitel_chat_members')
  .select('chat_id,user_id,role,last_read_at,joined_at')
  .eq('user_id',currentUser.id);
 if(error){
  console.error('MEMBERSHIP ERROR:',error);
  toast('دریافت عضویت‌ها ناموفق بود: '+error.message);
  return;
 }
 memberships=data||[];
}

/* پیدا کردن پروفایل طرف مقابل در پیوی */
async function loadDirectProfiles(chatIds){
 chatProfiles={};
 const directChats=myChats.filter(c=>
  chatIds.includes(c.id)&&c.chat_type==='direct'
 );
 if(!directChats.length)return;

 const ids=directChats.map(c=>c.id);
 const {data:members,error}=await db.from('aitel_chat_members')
  .select('chat_id,user_id')
  .in('chat_id',ids);

 if(error){
  console.warn('DIRECT MEMBERS ERROR:',error.message);
  return;
 }

 const otherIds=[...new Set((members||[])
  .filter(m=>m.user_id!==currentUser.id).map(m=>m.user_id))];
 if(!otherIds.length)return;

 const {data:profiles,error:profileError}=await db.from('aitel_profiles')
  .select('id,username,display_name,avatar_url,bio,is_verified')
  .in('id',otherIds);

 if(profileError){
  console.warn('DIRECT PROFILES ERROR:',profileError.message);
  return;
 }

 const profileMap={};
 (profiles||[]).forEach(p=>profileMap[p.id]=p);
 (members||[]).forEach(m=>{
  if(m.user_id!==currentUser.id&&profileMap[m.user_id]){
   chatProfiles[m.chat_id]=profileMap[m.user_id];
  }
 });
}

/* عضویت کانال */
async function joinChannel(channel){
 if(!channel)return;
 const exists=memberships.find(m=>m.chat_id===channel.chat_id);
 if(exists){
  await openChat(channel.chat_id,channel.title,'channel');
  return;
 }
 const {error}=await db.from('aitel_chat_members').insert({
  chat_id:channel.chat_id,user_id:currentUser.id,role:'member'
 });
 if(error){
  if(error.code==='23505'){
   await loadMemberships();
   if(memberships.some(m=>m.chat_id===channel.chat_id)){
    await openChat(channel.chat_id,channel.title,'channel');
    return;
   }
  }
  toast('عضویت انجام نشد: '+error.message);
  return;
 }
 toast('با موفقیت عضو کانال شدید');
 await loadMemberships();
 await loadUnread();
 await loadChats();
 renderList();
 await openChat(channel.chat_id,channel.title,'channel');
}
async function leaveChannel(chatId){
 const channel=channels.find(c=>c.chat_id===chatId);
 if(channel?.is_official){
  toast('کانال رسمی ایتل قابل ترک نیست');
  return;
 }
 if(!memberships.some(m=>m.chat_id===chatId)){
  toast('شما عضو این کانال نیستید');
  return;
 }
 if(!confirm('از عضویت این کانال خارج می‌شوید؟'))return;
 const {error}=await db.from('aitel_chat_members').delete()
  .eq('chat_id',chatId).eq('user_id',currentUser.id);
 if(error){
  toast('خروج ناموفق بود: '+error.message);
  console.error('LEAVE CHANNEL ERROR:',error);
  return;
 }
 if(currentChat?.id===chatId)closeChat();
 await loadMemberships();
 await loadUnread();
 await loadChats();
 toast('از کانال خارج شدید');
 renderList();
}

/* خوانده‌نشده‌ها */
async function loadUnread(){
 unreadMap={};
 for(const membership of memberships){
  const lastRead=membership.last_read_at||membership.joined_at||'1970-01-01';
  const {count,error}=await db.from('aitel_messages')
   .select('*',{count:'exact',head:true})
   .eq('chat_id',membership.chat_id)
   .neq('sender_id',currentUser.id)
   .gt('created_at',lastRead);
  if(!error)unreadMap[membership.chat_id]=count||0;
  else console.warn('UNREAD ERROR:',error.message);
 }
 updatePageTitle();renderList();
}
function updatePageTitle(){
 const total=Object.values(unreadMap).reduce((a,b)=>a+b,0);
 document.title=total?`(${total}) AITEL | ایتل`:'AITEL | ایتل';
}

  });
  filtered.forEach(c=>{

   const person=chatProfiles[c.id];

  });
 }
 if(!html)html='<div style="text-align:center;color:#999;padding:35px 10px;font-size:12px">موردی برای نمایش وجود ندارد</div>';
 list.innerHTML=html;

/* پیام‌ها */
async function loadMessages(chatId){
 const box=$('messages');
 if(!box||loadingMessages)return;
 loadingMessages=true;

 const {data,error}=await db.from('aitel_messages')
  .select('*').eq('chat_id',chatId)
  .order('created_at',{ascending:true}).limit(100);

 if(error){
  console.error('AITEL MESSAGE ERROR:',error);
  box.innerHTML=`<div style="text-align:center;padding:25px;color:#d44">
   <b>دریافت پیام‌ها ناموفق بود</b>
   <p style="font-size:11px;direction:ltr;overflow-wrap:anywhere">${escapeHTML(error.message)}</p>
   <button class="primary" onclick="loadMessages('${chatId}')">تلاش دوباره</button></div>`;
  loadingMessages=false;return;
 }

 const messages=data||[];
 const senderIds=[...new Set(messages.map(m=>m.sender_id).filter(Boolean))];
 const replyIds=[...new Set(messages.map(m=>m.reply_to).filter(Boolean))];
 let profileMap={};
 let replyMap={};

 if(senderIds.length){
  const {data:profiles,error:profileError}=await db.from('aitel_profiles')
   .select('id,username,display_name,avatar_url,is_verified')
   .in('id',senderIds);
  if(profileError)console.warn('SENDER PROFILE ERROR:',profileError.message);
  else (profiles||[]).forEach(p=>profileMap[p.id]=p);
 }
 if(replyIds.length){
  const {data:replies,error:replyError}=await db.from('aitel_messages')
   .select('id,content,sender_id,deleted_at')
   .in('id',replyIds);
  if(replyError)console.warn('REPLY FETCH ERROR:',replyError.message);
  else (replies||[]).forEach(r=>replyMap[r.id]=r);
 }

 messages.forEach(m=>{
  m.sender=profileMap[m.sender_id]||null;
  m.replyMessage=replyMap[m.reply_to]||null;
 });
 if(currentChat?.id!==chatId){loadingMessages=false;return}
 messageCache=messages;
 box.innerHTML=messages.map(renderMessage).join('')||
  '<div class="empty">هنوز پیامی ارسال نشده است</div>';
 box.scrollTop=box.scrollHeight;
 loadingMessages=false;
}

/* نمایش پیام */
function renderMessage(m){
 const mine=m.sender_id===currentUser.id;
 const sender=m.sender?.display_name||'کاربر ایتل';
 const deleted=!!m.deleted_at;
 const text=escapeHTML(deleted?'این پیام حذف شده است':m.content||'');
 const linked=deleted?text:text.replace(/@([a-zA-Z0-9_]+)/g,
  '<span style="color:#2878ed;font-weight:800;cursor:pointer" onclick="findUsername(\'$1\')">@$1</span>');
 let reply='';
 if(m.reply_to){
  const r=m.replyMessage;
  reply=`<div class="replyquote" onclick="scrollToMessage('${m.reply_to}')">
   <b>پاسخ به پیام</b><span>${escapeHTML(r?.deleted_at?'پیام حذف شده است':r?.content||'پیام اصلی')}</span>
  </div>`;
 }
 let actions='';
 if(!deleted){
  actions=`<div class="msg-actions">
   <button onclick="replyMessage('${m.id}')">↩ پاسخ</button>
   ${mine?`<button onclick="editMessage('${m.id}')">✎ ویرایش</button><button onclick="deleteMessage('${m.id}')">⌫ حذف</button>`:''}
  </div>`;
 }
 return `<div class="msg ${mine?'mine':''} ${deleted?'deleted':''}" id="msg-${m.id}">
  ${!mine?`<div class="sender" onclick="${m.sender?.username?`findUsername('${escapeHTML(m.sender.username)}')`:''}">${escapeHTML(sender)}</div>`:''}
  ${reply}
  <div>${linked}</div>
  <div class="time">${timeText(m.created_at)} ${m.edited_at&&!deleted?'<span class="edited">ویرایش‌شده</span>':''} ${mine?'<span class="ticks">✓</span>':''}</div>
  ${actions}
 </div>`;
}

/* پاسخ به پیام */
function replyMessage(id){
 const msg=messageCache.find(m=>m.id===id);
 if(!msg)return;
 replyTarget=msg;
 const name=msg.sender_id===currentUser.id?'پیام من':msg.sender?.display_name||'کاربر ایتل';
 $('replyContainer').innerHTML=`
  <div class="replybar">
   <div class="replytext"><b>پاسخ به ${escapeHTML(name)}</b>${escapeHTML(msg.content||'')}</div>
   <button onclick="cancelReply()">×</button>
  </div>`;
 $('messageInput')?.focus();
}
function cancelReply(){
 replyTarget=null;
 $('replyContainer').innerHTML='';
}
function scrollToMessage(id){
 const el=document.getElementById('msg-'+id);
 if(el){
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.style.outline='2px solid #2878ed';
  setTimeout(()=>el.style.outline='',1400);
 }else toast('پیام اصلی در این صفحه بارگذاری نشده است');

/* ویرایش پیام */
async function editMessage(id){
 const msg=messageCache.find(m=>m.id===id);
 if(!msg||msg.sender_id!==currentUser.id)return;
 const next=prompt('متن جدید پیام را وارد کنید:',msg.content||'');
 if(next===null)return;
 const content=next.trim();
 if(!content){toast('متن پیام نمی‌تواند خالی باشد');return}
 const {data,error}=await db.from('aitel_messages')
  .update({content,edited_at:new Date().toISOString()})
  .eq('id',id).eq('sender_id',currentUser.id)
  .select().maybeSingle();
 if(error){toast('ویرایش پیام ناموفق بود: '+error.message);return}
 if(!data){toast('پیام ویرایش نشد. دسترسی UPDATE را بررسی کنید.');return}
 toast('پیام ویرایش شد');
 await loadMessages(currentChat.id);
}

/* حذف نرم پیام */
async function deleteMessage(id){
 const msg=messageCache.find(m=>m.id===id);
 if(!msg||msg.sender_id!==currentUser.id)return;
 if(!confirm('این پیام برای همه حذف شود؟'))return;
 const {data,error}=await db.from('aitel_messages')
  .update({deleted_at:new Date().toISOString(),content:'این پیام حذف شده است'})
  .eq('id',id).eq('sender_id',currentUser.id)
  .select().maybeSingle();
 if(error){toast('حذف پیام ناموفق بود: '+error.message);return}
 if(!data){toast('پیام حذف نشد. دسترسی UPDATE را بررسی کنید.');return}
 toast('پیام حذف شد');

}

/* ارسال پیام */
async function sendMessage(){
 if(!currentChat||!currentUser)return;
 const input=$('messageInput');
 if(!input)return;
 const content=input.value.trim();
 if(!content)return;
 const chatId=currentChat.id;
 const payload={
  chat_id:chatId,sender_id:currentUser.id,
  message_type:'text',content
 };
 if(replyTarget)payload.reply_to=replyTarget.id;
 input.value='';
 const {error}=await db.from('aitel_messages').insert(payload);
 if(error){
  if($('messageInput'))$('messageInput').value=content;
  toast('ارسال پیام ناموفق بود: '+error.message);
  console.error('SEND MESSAGE ERROR:',error);
  return;
 }
 cancelReply();
 await loadMessages(chatId);
}

/* Realtime پیام‌ها */
function subscribeMessages(chatId){
 if(messageRealtime)db.removeChannel(messageRealtime);
 messageRealtime=db.channel('aitel-messages-'+chatId)
  .on('postgres_changes',{
   event:'*',schema:'public',table:'aitel_messages',filter:'chat_id=eq.'+chatId
  },async payload=>{
   if(currentChat?.id!==chatId)return;
   await loadMessages(chatId);
   if(payload.new?.sender_id!==currentUser.id)await markRead(chatId);
  }).subscribe(status=>{
   if(status==='CHANNEL_ERROR')console.warn('Message realtime connection error');
  });
}
function subscribeAll(){
 if(realtime)db.removeChannel(realtime);
 realtime=db.channel('aitel-global-'+currentUser.id)
  .on('postgres_changes',{
   event:'INSERT',schema:'public',table:'aitel_messages'
  },async payload=>{
   if(payload.new.sender_id===currentUser.id)return;
   const chatId=payload.new.chat_id;
   if(currentChat?.id===chatId){
    await loadMessages(chatId);await markRead(chatId);
   }else{
    await loadMemberships();await loadUnread();await loadChats();
    const count=Object.values(unreadMap).reduce((a,b)=>a+b,0);
    if(count)showNotification(count);
   }
  })
  .on('postgres_changes',{
   event:'*',schema:'public',table:'aitel_chat_members',
   filter:'user_id=eq.'+currentUser.id
  },async()=>{
   await loadMemberships();await loadUnread();await loadChats();
  })
  .subscribe(status=>{
   if(status==='CHANNEL_ERROR')console.warn('Global realtime connection error');
  });
}

/* ایجاد گفتگوی خصوصی */
async function startDirect(userId,name){
 if(userId===currentUser.id){toast('این پروفایل متعلق به خود شماست');return}
 const {data,error}=await db.rpc('aitel_create_direct_chat',{
  other_user_id:userId
 });
 if(error){
  toast('ساخت گفتگو ناموفق بود: '+error.message);
  console.error('DIRECT CHAT ERROR:',error);return;
 }
 closeModal();
 await loadMemberships();await loadChats();
 const chatId=typeof data==='string'?data:data?.chat_id||data?.id;
 if(chatId)await openChat(chatId,name,'direct');
 else toast('گفتگو ساخته شد اما شناسه آن دریافت نشد');
}

/* اطلاعات گفتگو */
function chatInfo(){
 if(!currentChat)return;
 const channel=channels.find(c=>c.chat_id===currentChat.id);
 if(channel){
  if(channel.is_official){
   showModal(`<div class="modalhead"><b>کانال رسمی AITEL</b><button class="iconbtn" onclick="closeModal()">×</button></div>
   <div class="profile"><div class="brandmark" style="margin:auto;width:75px;height:75px;border-radius:23px">${logoSmall()}</div>
   <h3>${escapeHTML(channel.title)} ${verifiedMark()}</h3>
   <p style="font-size:12px;color:var(--muted)">${escapeHTML(channel.description||'کانال رسمی پیام‌رسان ایتل')}</p>
   <span class="join joined">کانال رسمی و تأییدشده</span></div>`);
   return;
  }
  showModal(`<div class="modalhead"><b>اطلاعات کانال</b><button class="iconbtn" onclick="closeModal()">×</button></div>
   <div style="text-align:center;padding:15px">
    <div class="avatar" style="margin:auto">${escapeHTML(channel.icon||'📢')}</div>
    <h3>${escapeHTML(channel.title)}</h3>
    <p style="font-size:12px;color:var(--muted)">${escapeHTML(channel.description||'')}</p>
    <button class="dangerbtn" style="width:100%;margin-top:15px" onclick="closeModal();leaveChannel('${channel.chat_id}')">ترک کانال</button>
   </div>`);
  return;
 }
 const person=chatProfiles[currentChat.id];
 if(person){openUserProfile(person.id);return}
 toast(currentChat.type==='group'?'گروه ایتل':'گفتگوی خصوصی');
}

/* نصب برنامه */
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault();installPrompt=e;
});
async function installApp(){
 if(installPrompt){
  installPrompt.prompt();
  const result=await installPrompt.userChoice;
  installPrompt=null;
  toast(result.outcome==='accepted'?'درخواست نصب ارسال شد':'نصب لغو شد');
 }else{
  toast('در آیفون: دکمه Share مرورگر را بزنید و Add to Home Screen را انتخاب کنید.');
 }
}

/* راه‌اندازی */
async function startApp(){
 $('login').classList.add('hidden');
 await loadProfile();
 if(!myProfile)return;
 await loadChannels();
 await loadMemberships();
 await loadChats();
 await loadUnread();
 subscribeAll();

 document.addEventListener('visibilitychange',async()=>{
  if(!document.hidden&&currentChat){
   await markRead(currentChat.id);
   await loadMessages(currentChat.id);
  }
 });
 renderList();
}
boot();
</script>
