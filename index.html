<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>AITEL | ایتل</title>

<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#f7f8fc;--panel:#fff;--text:#171923;--muted:#8b91a1;
 --line:#eceef4;--primary:#6658e8;--primary2:#8277ff;
 --soft:#f0efff;--green:#20b77a;--danger:#e45163;
 --shadow:0 8px 30px rgba(25,30,60,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{width:370px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.top{padding:19px 18px 13px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:25px;font-weight:900;color:var(--primary);letter-spacing:-1px}
.version{font-size:10px;color:var(--muted);margin-right:5px}
.iconbtn{width:40px;height:40px;border-radius:14px;background:#f4f4fa;color:#555;display:grid;place-items:center;font-size:18px}
.search{padding:0 15px 13px}
.search input{width:100%;border:0;outline:0;background:#f4f5f9;border-radius:14px;padding:13px 15px}
.tabs{display:flex;padding:0 12px;gap:5px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:12px 4px;background:none;color:var(--muted);font-size:12px}
.tab.active{color:var(--primary);border-bottom:2px solid var(--primary);font-weight:800}
.list{overflow:auto;flex:1;padding:7px}
.item{display:flex;align-items:center;gap:11px;padding:11px;border-radius:15px;cursor:pointer}
.item:hover,.item.active{background:#f2f1ff}
.avatar{width:48px;height:48px;flex-shrink:0;border-radius:17px;background:linear-gradient(135deg,#7568ee,#a99fff);display:grid;place-items:center;color:white;font-size:21px;font-weight:800;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.iteminfo{flex:1;min-width:0}
.itemname{font-size:14px;font-weight:800;display:flex;align-items:center;gap:5px}
.preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.badgecount{background:var(--primary);color:white;border-radius:20px;min-width:21px;height:21px;padding:0 6px;display:grid;place-items:center;font-size:10px}
.chatarea{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.empty{margin:auto;text-align:center;color:var(--muted)}
.empty .big{font-size:65px}
.chathead{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px}
.chathead .name{font-weight:800}
.chathead .sub{font-size:11px;color:var(--muted)}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:9px;background-color:#f8f9fd}
.msg{max-width:min(78%,520px);padding:10px 13px;border-radius:16px;background:white;box-shadow:0 2px 8px #00000008;align-self:flex-start;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:#e9e6ff;border-bottom-right-radius:5px}
.msg .sender{font-size:11px;color:var(--primary);font-weight:800;margin-bottom:4px}
.msg .time{font-size:9px;color:#9a9eac;text-align:left;margin-top:5px}
.msg .ticks{color:var(--primary);margin-right:4px}
.composer{padding:12px 15px;background:white;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}
.composer input{flex:1;min-width:0;border:0;outline:0;background:#f4f5f9;border-radius:20px;padding:13px 17px;font-size:14px}
.send{width:46px;height:46px;border-radius:16px;background:var(--primary);color:white;font-size:19px}
.login{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{background:white;border-radius:26px;padding:32px 24px;width:min(390px,100%);text-align:center;box-shadow:var(--shadow)}
.loginlogo{font-size:48px;font-weight:900;color:var(--primary)}
.google{width:100%;padding:14px;border-radius:14px;background:var(--primary);color:white;font-weight:800;margin-top:20px}
.hidden{display:none!important}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#202231;color:white;padding:12px 18px;border-radius:13px;font-size:12px;z-index:99;box-shadow:var(--shadow);max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:#11182777;z-index:30;display:flex;align-items:center;justify-content:center;padding:15px}
.modalbox{width:min(480px,100%);max-height:85dvh;overflow:auto;background:white;border-radius:23px;padding:20px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.channelcard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:15px;margin-bottom:9px}
.channelcard .details{flex:1;min-width:0}
.channelcard b{font-size:13px}
.channelcard small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.join{background:var(--soft);color:var(--primary);padding:8px 12px;border-radius:10px;font-size:11px;font-weight:800}
.join.joined{background:#e9f8f1;color:#159664}
.profile{padding:20px;text-align:center}
.profile .avatar{margin:auto;width:85px;height:85px;border-radius:28px}
.profile input,.profile textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:10px;outline:0}
.primary{background:var(--primary);color:white;padding:12px 17px;border-radius:12px;font-weight:800}
@media(max-width:700px){
 .sidebar{width:100%;border:0}
 .chatarea{display:none}
 .app.chat-open .sidebar{display:none}
 .app.chat-open .chatarea{display:flex}
 .chathead{height:64px}
 .back{display:grid!important}
}
.back{display:none}
</style>
</head>

<body>

<div class="app" id="app">
 <aside class="sidebar">
  <div class="top">
   <div><span class="brand">AITEL</span><span class="version">v1.0.0</span></div>
   <button class="iconbtn" onclick="openChannels()">◈</button>
  </div>

  <div class="search">
   <input id="searchInput" placeholder="جست‌وجوی گفتگو، کانال یا کاربر..." oninput="renderList()">
  </div>

  <div class="tabs">
   <button class="tab active" onclick="switchTab('chats',this)">گفتگوها</button>
   <button class="tab" onclick="switchTab('channels',this)">کانال‌ها</button>
   <button class="tab" onclick="switchTab('groups',this)">گروه‌ها</button>
  </div>

  <div class="list" id="list"></div>

  <div style="padding:12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center">
   <div class="avatar" id="myAvatar" style="width:40px;height:40px" onclick="openProfile()">؟</div>
   <div style="flex:1;min-width:0" onclick="openProfile()">
    <b id="myName" style="font-size:13px">پروفایل من</b>
    <div id="myUsername" style="font-size:10px;color:var(--muted)">تنظیم حساب</div>
   </div>
   <button class="iconbtn" onclick="openProfile()">⚙</button>
  </div>
 </aside>

 <main class="chatarea" id="chatArea">
  <div class="empty">
   <div class="big">✉</div>
   <b>به ایتل خوش آمدید</b>
   <p style="font-size:12px">برای شروع یک گفتگو را انتخاب کنید.</p>
  </div>
 </main>
</div>

<div class="login hidden" id="login">
 <div class="loginbox">
  <div class="loginlogo">AITEL</div>
  <h2>ارتباط، ساده‌تر از همیشه</h2>
  <p style="color:var(--muted);font-size:13px">وارد حساب خود شوید و گفتگو را آغاز کنید.</p>
  <button class="google" onclick="loginGoogle()">ورود با حساب Google</button>
  <p style="font-size:10px;color:var(--muted);margin-top:20px">AITEL Messenger · v1.0.0</p>
 </div>
</div>

<div class="modal hidden" id="modal" onclick="if(event.target===this)closeModal()">
 <div class="modalbox" id="modalContent"></div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
/* تنظیمات اتصال */
const SUPABASE_URL='https://psvesfkxtmlnjyhphsfs.supabase.co';
const SUPABASE_KEY='sb_publishable_QClWgLVOmPGwPK_kTsL5UA_L0cNqJ4H';
const SITE_URL='https://v2gurd.github.io/AITEL/';

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
 auth:{
  persistSession:true,
  autoRefreshToken:true,
  detectSessionInUrl:false,
  flowType:'pkce'
 }
});

let currentUser=null;
let myProfile=null;
let currentChat=null;
let currentTab='chats';
let myChats=[];
let channels=[];
let memberships=[];
let unreadMap={};
let realtime=null;
let messageRealtime=null;
let notificationPermission=false;

const $=id=>document.getElementById(id);

function toast(message){
 const el=$('toast');
 el.textContent=message;
 el.classList.remove('hidden');
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2800);
}

function escapeHTML(value=''){
 return String(value).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function timeText(value){
 if(!value)return '';
 return new Date(value).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
}

function avatarHTML(profile){
 if(profile?.avatar_url){
  return `<img src="${escapeHTML(profile.avatar_url)}" alt="">`;
 }
 return escapeHTML((profile?.display_name||profile?.title||'ا').slice(0,1));
}

/* ورود گوگل */
async function loginGoogle(){
 const {error}=await db.auth.signInWithOAuth({
  provider:'google',
  options:{
   redirectTo:SITE_URL,
   queryParams:{access_type:'offline',prompt:'select_account'}
  }
 });
 if(error)toast('خطا در ورود: '+error.message);
}

async function handleOAuth(){
 const params=new URLSearchParams(location.search);
 const code=params.get('code');
 if(code){
  const {error}=await db.auth.exchangeCodeForSession(code);
  if(error)toast('خطای ورود گوگل: '+error.message);
  history.replaceState({},document.title,location.pathname);
 }
}

async function boot(){
 await handleOAuth();
 const {data,error}=await db.auth.getSession();
 if(error)console.error(error);
 if(data.session){
  currentUser=data.session.user;
  await startApp();
 }else{
  $('login').classList.remove('hidden');
 }

 db.auth.onAuthStateChange(async(event,session)=>{
  if(session?.user&&!currentUser){
   currentUser=session.user;
   await startApp();
  }
  if(event==='SIGNED_OUT'){
   location.reload();
  }
 });
}

/* پروفایل */
async function loadProfile(){
 const {data,error}=await db.from('aitel_profiles')
  .select('*').eq('id',currentUser.id).maybeSingle();

 if(error)console.error(error);

 if(data){
  myProfile=data;
 }else{
  const displayName=currentUser.user_metadata?.full_name||
   currentUser.email?.split('@')[0]||'کاربر ایتل';
  const username='user_'+currentUser.id.replaceAll('-','').slice(0,10);

  const {data:newProfile,error:insertError}=await db.from('aitel_profiles')
   .insert({
    id:currentUser.id,
    display_name:displayName,
    username:username,
    bio:''
   }).select().single();

  if(insertError){
   toast('ساخت پروفایل با خطا مواجه شد: '+insertError.message);
   return;
  }
  myProfile=newProfile;
 }

 $('myName').textContent=myProfile.display_name;
 $('myUsername').textContent='@'+(myProfile.username||'');
 $('myAvatar').innerHTML=avatarHTML(myProfile);
}

/* کانال‌ها */
async function loadChannels(){
 const {data,error}=await db.from('aitel_public_channels')
  .select('*').order('created_at',{ascending:true});

 if(error){
  console.error(error);
  toast('دریافت کانال‌ها ناموفق بود');
  return;
 }
 channels=data||[];
}

async function loadMemberships(){
 const {data,error}=await db.from('aitel_chat_members')
  .select('chat_id,role,last_read_at,joined_at')
  .eq('user_id',currentUser.id);

 if(error){
  console.error(error);
  return;
 }
 memberships=data||[];
}

async function joinChannel(channel){
 const exists=memberships.find(m=>m.chat_id===channel.chat_id);
 if(exists){
  await openChat(channel.chat_id,channel.title,'channel');
  return;
 }

 const {error}=await db.from('aitel_chat_members').insert({
  chat_id:channel.chat_id,
  user_id:currentUser.id,
  role:'member'
 });

 if(error){
  toast('عضویت انجام نشد: '+error.message);
  return;
 }

 toast('با موفقیت عضو کانال شدید');
 await loadMemberships();
 await loadUnread();
 renderList();
 await openChat(channel.chat_id,channel.title,'channel');
}

/* گفتگوها و شمارنده خوانده‌نشده */
async function loadChats(){
 const ids=memberships.map(m=>m.chat_id);
 if(!ids.length){
  myChats=[];
  renderList();
  return;
 }

 const {data,error}=await db.from('aitel_chats')
  .select('*').in('id',ids).order('updated_at',{ascending:false});

 if(error){
  console.error(error);
  return;
 }

 myChats=data||[];
 renderList();
}

async function loadUnread(){
 unreadMap={};

 for(const membership of memberships){
  const lastRead=membership.last_read_at||membership.joined_at||'1970-01-01';
  const {count,error}=await db.from('aitel_messages')
   .select('*',{count:'exact',head:true})
   .eq('chat_id',membership.chat_id)
   .neq('sender_id',currentUser.id)
   .gt('created_at',lastRead);

  if(!error)unreadMap[membership.chat_id]=count||0;
 }

 updatePageTitle();
 renderList();
}

function updatePageTitle(){
 const total=Object.values(unreadMap).reduce((a,b)=>a+b,0);
 document.title=total?`(${total}) AITEL | ایتل`:'AITEL | ایتل';
}

/* لیست اصلی */
function renderList(){
 const list=$('list');
 const q=$('searchInput').value.trim().toLowerCase();
 let html='';

 if(currentTab==='channels'){
  channels.filter(c=>(c.title+' '+c.description).toLowerCase().includes(q))
   .forEach(c=>{
    const joined=memberships.some(m=>m.chat_id===c.chat_id);
    html+=`
     <div class="item" onclick="joinChannelById('${c.chat_id}')">
      <div class="avatar">${escapeHTML(c.icon||'📢')}</div>
      <div class="iteminfo">
       <div class="itemname">${escapeHTML(c.title)}</div>
       <div class="preview">${escapeHTML(c.description||'کانال عمومی ایتل')}</div>
      </div>
      <span class="badgecount" style="background:#eeeaff;color:#6658e8">${joined?'عضو':'+'}</span>
     </div>`;
   });
 }else{
  const filtered=myChats.filter(c=>{
   if(currentTab==='groups'&&c.chat_type!=='group')return false;
   if(currentTab==='chats'&&c.chat_type==='channel')return false;
   return (c.title||'').toLowerCase().includes(q);
  });

  filtered.forEach(c=>{
   const channel=channels.find(x=>x.chat_id===c.id);
   const unread=unreadMap[c.id]||0;
   html+=`
    <div class="item ${currentChat?.id===c.id?'active':''}" onclick="openChat('${c.id}','${escapeHTML(c.title||'گفتگو')}','${c.chat_type}')">
     <div class="avatar">${channel?escapeHTML(channel.icon):c.chat_type==='group'?'👥':'👤'}</div>
     <div class="iteminfo">
      <div class="itemname">${escapeHTML(c.title||'گفتگو')}</div>
      <div class="preview">${c.chat_type==='channel'?'کانال':c.chat_type==='group'?'گروه':'گفتگوی خصوصی'}</div>
     </div>
     ${unread?`<span class="badgecount">${unread}</span>`:''}
    </div>`;
  });
 }

 if(!html)html='<div style="text-align:center;color:#999;padding:35px 10px;font-size:12px">موردی برای نمایش وجود ندارد</div>';
 list.innerHTML=html;
}

function switchTab(tab,button){
 currentTab=tab;
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 button.classList.add('active');
 renderList();
}

async function joinChannelById(id){
 const channel=channels.find(c=>c.chat_id===id);
 if(channel)await joinChannel(channel);
}

/* بازکردن گفتگو */
async function openChat(id,title,type='direct'){
 currentChat={id,title,type};
 $('app').classList.add('chat-open');

 const channel=channels.find(c=>c.chat_id===id);
 const official=channel?.icon||'';

 $('chatArea').innerHTML=`
  <div class="chathead">
   <button class="iconbtn back" onclick="closeChat()">‹</button>
   <div class="avatar" style="width:43px;height:43px">${escapeHTML(official|| (type==='group'?'👥':'👤'))}</div>
   <div style="flex:1">
    <div class="name">${escapeHTML(title)}</div>
    <div class="sub">${type==='channel'?'کانال عمومی ایتل':type==='group'?'گروه ایتل':'گفتگو'}</div>
   </div>
   <button class="iconbtn" onclick="chatInfo()">⋮</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="composer">
   <input id="messageInput" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
   <button class="send" onclick="sendMessage()">➤</button>
  </div>`;

 await markRead(id);
 await loadMessages(id);
 renderList();
 subscribeMessages(id);
}

function closeChat(){
 $('app').classList.remove('chat-open');
 currentChat=null;
 if(messageRealtime){
  db.removeChannel(messageRealtime);
  messageRealtime=null;
 }
 $('chatArea').innerHTML=`<div class="empty"><div class="big">✉</div><b>به ایتل خوش آمدید</b><p style="font-size:12px">برای شروع یک گفتگو را انتخاب کنید.</p></div>`;
}

async function markRead(chatId){
 const {error}=await db.from('aitel_chat_members')
  .update({last_read_at:new Date().toISOString()})
  .eq('chat_id',chatId).eq('user_id',currentUser.id);

 if(error)console.warn('markRead:',error.message);
 unreadMap[chatId]=0;
 updatePageTitle();
}

async function loadMessages(chatId){
 const box=$('messages');
 if(!box)return;

 const {data,error}=await db.from('aitel_messages')
  .select('*,sender:aitel_profiles(username,display_name,avatar_url)')
  .eq('chat_id',chatId)
  .is('deleted_at',null)
  .order('created_at',{ascending:true})
  .limit(100);

 if(error){
  box.innerHTML='<div class="empty">دریافت پیام‌ها ناموفق بود</div>';
  console.error(error);
  return;
 }

 box.innerHTML=(data||[]).map(renderMessage).join('');
 box.scrollTop=box.scrollHeight;
}

function renderMessage(m){
 const mine=m.sender_id===currentUser.id;
 const sender=m.sender?.display_name||'کاربر ایتل';
 const text=escapeHTML(m.content||'');
 const linked=text.replace(/@([a-zA-Z0-9_]+)/g,
  '<span style="color:#6658e8;font-weight:800;cursor:pointer" onclick="findUsername(\'$1\')">@$1</span>');

 return `
  <div class="msg ${mine?'mine':''}">
   ${!mine?`<div class="sender">${escapeHTML(sender)}</div>`:''}
   <div>${linked}</div>
   <div class="time">${timeText(m.created_at)} ${mine?'<span class="ticks">✓</span>':''}</div>
  </div>`;
}

/* ارسال پیام */
async function sendMessage(){
 if(!currentChat)return;
 const input=$('messageInput');
 const content=input.value.trim();
 if(!content)return;

 input.value='';
 const {error}=await db.from('aitel_messages').insert({
  chat_id:currentChat.id,
  sender_id:currentUser.id,
  message_type:'text',
  content:content
 });

 if(error){
  input.value=content;
  toast('ارسال پیام ناموفق بود: '+error.message);
  return;
 }

 await loadMessages(currentChat.id);
}

/* پیام‌های لحظه‌ای */
function subscribeMessages(chatId){
 if(messageRealtime)db.removeChannel(messageRealtime);

 messageRealtime=db.channel('aitel-messages-'+chatId)
  .on('postgres_changes',{
   event:'INSERT',
   schema:'public',
   table:'aitel_messages',
   filter:'chat_id=eq.'+chatId
  },async payload=>{
   if(payload.new.sender_id===currentUser.id)return;
   await loadMessages(chatId);
   await markRead(chatId);
  }).subscribe();
}

function subscribeAll(){
 if(realtime)db.removeChannel(realtime);

 realtime=db.channel('aitel-global-'+currentUser.id)
  .on('postgres_changes',{
   event:'INSERT',schema:'public',table:'aitel_messages'
  },async payload=>{
   if(payload.new.sender_id===currentUser.id)return;

   const chatId=payload.new.chat_id;
   if(currentChat?.id===chatId){
    await loadMessages(chatId);
    await markRead(chatId);
   }else{
    await loadMemberships();
    await loadUnread();
    await loadChats();

    const count=Object.values(unreadMap).reduce((a,b)=>a+b,0);
    if(count)showNotification(count);
   }
  })
  .on('postgres_changes',{
   event:'*',schema:'public',table:'aitel_chat_members',
   filter:'user_id=eq.'+currentUser.id
  },async()=>{
   await loadMemberships();
   await loadUnread();
   await loadChats();
  })
  .subscribe();
}

/* اعلان‌ها */
async function enableNotifications(){
 if(!('Notification' in window)){
  toast('مرورگر شما اعلان را پشتیبانی نمی‌کند');
  return;
 }
 const permission=await Notification.requestPermission();
 notificationPermission=permission==='granted';
 toast(notificationPermission?'اعلان‌ها فعال شدند':'اجازه اعلان داده نشد');
}

function showNotification(count){
 if(document.hidden&&Notification.permission==='granted'){
  new Notification('AITEL | ایتل',{
   body:`شما ${count.toLocaleString('fa-IR')} پیام جدید دارید.`,
   icon:'./icon-192.png'
  });
 }else{
  toast(`${count.toLocaleString('fa-IR')} پیام جدید دارید`);
 }
}

/* کانال‌ها */
function openChannels(){
 let html=`
  <div class="modalhead">
   <b>کانال‌های عمومی ایتل</b>
   <button class="iconbtn" onclick="closeModal()">×</button>
  </div>
  <p style="font-size:11px;color:var(--muted)">عضویت فقط با انتخاب شما انجام می‌شود. تعداد اعضا از عضویت‌های واقعی محاسبه می‌شود.</p>`;

 channels.forEach(c=>{
  const joined=memberships.some(m=>m.chat_id===c.chat_id);
  html+=`
   <div class="channelcard">
    <div class="avatar">${escapeHTML(c.icon||'📢')}</div>
    <div class="details">
     <b>${escapeHTML(c.title)}</b>
     <small>${escapeHTML(c.description||'کانال عمومی')}</small>
     <small>هدف کانال: ${Number(c.target_members||5000).toLocaleString('fa-IR')} عضو</small>
    </div>
    <button class="join ${joined?'joined':''}" onclick="closeModal();joinChannelById('${c.chat_id}')">${joined?'ورود':'عضویت'}</button>
   </div>`;
 });

 $('modalContent').innerHTML=html;
 $('modal').classList.remove('hidden');
}

function closeModal(){
 $('modal').classList.add('hidden');
}

/* پروفایل */
function openProfile(){
 $('modalContent').innerHTML=`
  <div class="modalhead">
   <b>پروفایل من</b>
   <button class="iconbtn" onclick="closeModal()">×</button>
  </div>
  <div class="profile">
   <div class="avatar">${avatarHTML(myProfile)}</div>
   <input id="profileName" value="${escapeHTML(myProfile?.display_name||'')}" placeholder="نام نمایشی">
   <input id="profileUsername" value="${escapeHTML(myProfile?.username||'')}" placeholder="نام کاربری">
   <textarea id="profileBio" placeholder="درباره من">${escapeHTML(myProfile?.bio||'')}</textarea>
   <button class="primary" style="width:100%;margin-top:15px" onclick="saveProfile()">ذخیره تغییرات</button>
   <button class="join" style="width:100%;margin-top:10px" onclick="enableNotifications()">فعال‌سازی اعلان‌ها</button>
   <button class="join" style="width:100%;margin-top:10px;color:#d44" onclick="logout()">خروج از حساب</button>
  </div>`;
 $('modal').classList.remove('hidden');
}

async function saveProfile(){
 const display_name=$('profileName').value.trim();
 const username=$('profileUsername').value.trim().replace(/^@/,'');
 const bio=$('profileBio').value.trim();

 if(!display_name||!username){
  toast('نام و نام کاربری را وارد کنید');
  return;
 }
 if(!/^[a-zA-Z0-9_]{3,30}$/.test(username)){
  toast('نام کاربری باید حداقل ۳ حرف و فقط شامل حروف انگلیسی، عدد و _ باشد');
  return;
 }

 const {data,error}=await db.from('aitel_profiles')
  .update({display_name,username,bio})
  .eq('id',currentUser.id)
  .select().single();

 if(error){
  toast('ذخیره نشد: '+error.message);
  return;
 }

 myProfile=data;
 $('myName').textContent=data.display_name;
 $('myUsername').textContent='@'+data.username;
 closeModal();
 toast('پروفایل ذخیره شد');
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

/* جست‌وجوی کاربر */
async function findUsername(username){
 const {data,error}=await db.from('aitel_profiles')
  .select('id,username,display_name,bio,avatar_url')
  .eq('username',username).maybeSingle();

 if(error||!data){
  toast('کاربری با این نام پیدا نشد');
  return;
 }

 $('modalContent').innerHTML=`
  <div class="modalhead"><b>پروفایل کاربر</b><button class="iconbtn" onclick="closeModal()">×</button></div>
  <div class="profile">
   <div class="avatar">${avatarHTML(data)}</div>
   <h3>${escapeHTML(data.display_name)}</h3>
   <p style="color:var(--primary)">@${escapeHTML(data.username)}</p>
   <p style="font-size:12px;color:var(--muted)">${escapeHTML(data.bio||'')}</p>
   <button class="primary" onclick="startDirect('${data.id}','${escapeHTML(data.display_name)}')">ارسال پیام</button>
  </div>`;
 $('modal').classList.remove('hidden');
}

/* ایجاد گفتگوی خصوصی */
async function startDirect(userId,name){
 const {data,error}=await db.rpc('aitel_create_direct_chat',{
  other_user_id:userId
 });

 if(error){
  toast('ساخت گفتگو ناموفق بود: '+error.message);
  return;
 }

 closeModal();
 await loadMemberships();
 await loadChats();

 const chatId=typeof data==='string'?data:data?.chat_id||data?.id;
 if(chatId)await openChat(chatId,name,'direct');
}

/* اطلاعات گفتگو */
function chatInfo(){
 if(!currentChat)return;
 toast(currentChat.type==='channel'?'کانال عمومی ایتل':currentChat.type==='group'?'گروه ایتل':'گفتگوی خصوصی');
}

/* راه‌اندازی */
async function startApp(){
 $('login').classList.add('hidden');
 await loadProfile();
 await loadChannels();
 await loadMemberships();
 await loadChats();
 await loadUnread();
 subscribeAll();

 if('Notification' in window&&Notification.permission==='granted'){
  notificationPermission=true;
 }

 document.addEventListener('visibilitychange',async()=>{
  if(!document.hidden&&currentChat){
   await markRead(currentChat.id);
   await loadMessages(currentChat.id);
  }
 });

 renderList();
}

boot();
</script>
</body>
</html>
