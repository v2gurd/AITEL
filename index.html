<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>AITEL | ایتل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#f5f6fb;--panel:#fff;--panel2:#f0eff8;--text:#202033;
 --muted:#9292a8;--primary:#7657e8;--primary2:#a18aff;
 --border:#e9e8f1;--bubble:#f0eff7;--mine:#7657e8;
 --mineText:#fff;--shadow:0 12px 40px #24204b12;
 --radius:20px;--wall:radial-gradient(circle at 20% 20%,#8b72ff12 0 2px,transparent 3px);
}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;transition:.25s}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;padding:12px;gap:12px}
.sidebar{width:360px;min-width:300px;background:var(--panel);border:1px solid var(--border);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.brand{padding:19px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brandname{font-size:25px;font-weight:900;letter-spacing:-1px;color:var(--primary)}
.brandname span{color:var(--text)}
.iconbtn{border:0;background:var(--panel2);color:var(--text);width:40px;height:40px;border-radius:14px;font-size:18px}
.userbar{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--border)}
.avatar{width:43px;height:43px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;display:grid;place-items:center;font-weight:800;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.userinfo{flex:1;min-width:0}
.userinfo strong,.chatrow strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{font-size:12px;color:var(--muted)}
.searchbox{margin:14px 15px 8px;background:var(--panel2);border-radius:14px;padding:0 13px;display:flex;align-items:center}
.searchbox input{width:100%;height:43px;background:transparent;border:0;outline:0;color:var(--text)}
.tabs{display:flex;padding:0 14px 10px;gap:7px}
.tab{border:0;border-radius:12px;padding:8px 12px;background:var(--panel2);color:var(--muted);font-size:12px}
.tab.active{background:var(--primary);color:white}
.chatlist{overflow:auto;flex:1;padding:5px 9px}
.chatrow{display:flex;gap:11px;align-items:center;padding:12px 10px;border-radius:16px;cursor:pointer;transition:.15s}
.chatrow:hover,.chatrow.active{background:var(--panel2)}
.chatrow .avatar{width:48px;height:48px}
.chatinfo{flex:1;min-width:0}
.chatinfo p{font-size:12px;color:var(--muted);margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatmeta{font-size:10px;color:var(--muted)}
.main{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);position:relative}
.welcome{margin:auto;text-align:center;padding:25px}
.logo-big{width:90px;height:90px;margin:0 auto 18px;border-radius:30px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;display:grid;place-items:center;font-size:42px;font-weight:900;box-shadow:0 15px 40px color-mix(in srgb,var(--primary) 30%,transparent)}
.welcome h2{margin:0 0 8px}
.welcome p{color:var(--muted);font-size:13px}
.chatheader{display:none;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border);gap:12px}
.chatheader .peerinfo{flex:1;min-width:0}
.chatheader strong{display:block}
.chatheader small{color:var(--muted)}
.messages{flex:1;overflow:auto;padding:20px;background-color:var(--bg);background-image:var(--wall);background-size:32px 32px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:min(75%,600px);padding:10px 13px;border-radius:17px;background:var(--panel);box-shadow:0 3px 12px #00000008;align-self:flex-start;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--mine);color:var(--mineText);border-bottom-right-radius:5px}
.msg:not(.mine){border-bottom-left-radius:5px}
.msg .sender{font-size:11px;font-weight:800;color:var(--primary);margin-bottom:4px}
.msg.mine .sender{color:#ffffffb8}
.msgtime{font-size:10px;color:var(--muted);text-align:left;margin-top:5px}
.msg.mine .msgtime{color:#ffffffa8}
.msg img{max-width:100%;max-height:280px;border-radius:12px;display:block}
.msg a{color:inherit}
.composer{display:none;padding:12px 14px;gap:9px;align-items:flex-end;border-top:1px solid var(--border);background:var(--panel)}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:130px;border:0;outline:0;background:var(--panel2);color:var(--text);border-radius:15px;padding:12px}
.sendbtn{width:46px;height:46px;border:0;border-radius:15px;background:var(--primary);color:white;font-size:20px}
.modaloverlay{display:none;position:fixed;inset:0;background:#100d25a8;z-index:20;align-items:center;justify-content:center;padding:16px}
.modal{width:min(560px,100%);max-height:88dvh;overflow:auto;background:var(--panel);border-radius:23px;padding:20px;box-shadow:var(--shadow)}
.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.modalhead h3{margin:0}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px;outline:0}
.primarybtn{background:var(--primary);color:white;border:0;border-radius:13px;padding:11px 17px;font-weight:700}
.secondarybtn{background:var(--panel2);color:var(--text);border:0;border-radius:13px;padding:10px 14px}
.modalactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.themegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.themeitem{border:1px solid var(--border);border-radius:14px;padding:10px;background:var(--panel);color:var(--text);text-align:right;display:flex;align-items:center;gap:10px}
.themeitem.active{outline:2px solid var(--primary)}
.swatches{display:flex;gap:3px}
.swatches i{width:13px;height:28px;border-radius:5px;display:block}
.themeitem small{display:block;color:var(--muted);font-size:10px}
.themefilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.themefilters button{border:0;background:var(--panel2);color:var(--text);padding:7px 10px;border-radius:10px;font-size:11px}
.themefilters button.active{background:var(--primary);color:white}
.login{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{width:min(390px,100%);text-align:center;background:var(--panel);padding:35px 25px;border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow)}
.googlebtn{width:100%;margin-top:20px;border:1px solid var(--border);border-radius:14px;padding:13px;background:var(--panel);color:var(--text);font-weight:700}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#242238;color:white;padding:11px 18px;border-radius:13px;z-index:90;display:none;font-size:13px;max-width:90%;text-align:center}
.memberdemo{font-size:10px;color:var(--muted);margin-top:4px}
@media(max-width:700px){
 .app{padding:0;gap:0}
 .sidebar{width:100%;min-width:0;border:0;border-radius:0}
 .main{display:none;border:0;border-radius:0}
 body.inchat .sidebar{display:none}
 body.inchat .main{display:flex}
 .chatheader{padding:10px}
 .messages{padding:13px}
 .msg{max-width:88%}
}
</style>

</div>

function applyTheme(id){
 const index=Math.max(0,Math.min(49,Number(String(id).replace('theme',''))-1));
 const t=themes[index]||themes[0];
 const root=document.documentElement;
 root.style.setProperty('--bg',t[1]);
 root.style.setProperty('--panel',t[2]);
 root.style.setProperty('--primary',t[3]);
 root.style.setProperty('--primary2',t[4]);
 root.style.setProperty('--text',t[5]);
 root.style.setProperty('--panel2',mix(t[1],t[3],.07));
 root.style.setProperty('--border',mix(t[1],t[5],.10));
 root.style.setProperty('--bubble',mix(t[1],t[3],.08));
 root.style.setProperty('--mine',t[3]);
 root.style.setProperty('--mineText','#ffffff');
 root.style.setProperty('--wall',index%5===0
  ?'radial-gradient(circle at 20% 20%,var(--primary)18 0 2px,transparent 3px)'
  :index%5===1
  ?'repeating-linear-gradient(135deg,transparent 0 24px,var(--border) 25px,transparent 26px 48px)'
  :index%5===2
  ?'radial-gradient(ellipse at 80% 10%,var(--primary)12,transparent 45%)'
  :index%5===3
  ?'radial-gradient(circle at 10% 90%,var(--primary)16,transparent 35%)'
  :'linear-gradient(145deg,transparent 45%,var(--border) 46%,transparent 47%)');
 currentTheme='theme'+(index+1);
 localStorage.setItem('aitel-theme',currentTheme);
 document.querySelectorAll('.themeitem').forEach((el,i)=>el.classList.toggle('active',i===index));
}
function mix(a,b,ratio){
 const hex=s=>s.replace('#','');
 const x=hex(a),y=hex(b);
 const c=[0,2,4].map(i=>Math.round(parseInt(x.slice(i,i+2),16)*(1-ratio)+parseInt(y.slice(i,i+2),16)*ratio).toString(16).padStart(2,'0'));
 return '#'+c.join('');
}
function openThemes(){

 <button onclick="filterThemes('light',this)">روشن</button>
 <button onclick="filterThemes('dark',this)">تیره</button>
 <button onclick="filterThemes('color',this)">رنگی</button>
 </div>
 <div class="themegrid" id="themeGrid">
 ${themes.map((t,i)=>`<button class="themeitem ${currentTheme==='theme'+(i+1)?'active':''}" data-kind="${i>=8&&i<=13||i>=19&&i<=21||i>=29&&i<=35||i>=43&&i<=48?'dark':i%3===0?'light':'color'}" onclick="applyTheme('theme${i+1}')">
 <span class="swatches"><i style="background:${t[1]}"></i><i style="background:${t[3]}"></i><i style="background:${t[4]}"></i></span>
 <span><b>${t[0]}</b><small>تم شماره ${i+1}</small></span>
 </button>`).join('')}
 </div>`;
 openModal(html);
}
function filterThemes(kind,button){
 document.querySelectorAll('.themefilters button').forEach(b=>b.classList.remove('active'));
 button.classList.add('active');
 document.querySelectorAll('.themeitem').forEach(el=>el.style.display=kind==='all'||el.dataset.kind===kind?'flex':'none');
}

/* ابزارهای عمومی */
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(s='A'){return String(s).trim().slice(0,1)||'A'}
function avatarMarkup(url,name){
 return url?`<div class="avatar"><img src="${esc(url)}" alt=""></div>`:`<div class="avatar">${esc(initials(name))}</div>`;
}
function toast(msg){
 const el=document.getElementById('toast');
 el.textContent=msg;el.style.display='block';
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3200);
}
function openModal(html){
 document.getElementById('modal').innerHTML=html;
 document.getElementById('modalOverlay').style.display='flex';
}
function closeModal(){document.getElementById('modalOverlay').style.display='none'}
function formatTime(d){
 if(!d)return '';
 return new Date(d).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
}
function setFilter(f,btn){
 currentFilter=f;
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');renderChats();
}

/* ورود گوگل و مدیریت نشست */
async function loginGoogle(){
 const btn=document.getElementById('googleLogin');
 btn.disabled=true;btn.textContent='در حال انتقال...';
 const {error}=await sb.auth.signInWithOAuth({
  provider:'google',
  options:{redirectTo:SITE_URL,queryParams:{access_type:'offline',prompt:'select_account'}}
 });
 if(error){toast(error.message);btn.disabled=false;btn.textContent='ورود با حساب Google'}
}
async function boot(){
 applyTheme(currentTheme);
 const url=new URL(location.href);
 const code=url.searchParams.get('code');
 if(code&&!bootExchangeStarted){
  bootExchangeStarted=true;
  const {error}=await sb.auth.exchangeCodeForSession(code);
  history.replaceState({},document.title,SITE_URL);
  if(error)toast('خطا در تکمیل ورود: '+error.message);
 }
 const {data:{session}}=await sb.auth.getSession();
 if(session)await handleSession(session);
 sb.auth.onAuthStateChange(async(event,session)=>{
  if(session&&(!me||me.id!==session.user.id))await handleSession(session);
  if(event==='SIGNED_OUT')location.reload();
 });
}
async function handleSession(session){
 me=session.user;
 document.getElementById('loginScreen').style.display='none';
 await loadProfile();
 await loadChats();
 subscribeProfile();
}
async function loadProfile(){
 let {data,error}=await sb.from('aitel_profiles').select('*').eq('id',me.id).maybeSingle();
 if(error){toast('خطای دریافت پروفایل: '+error.message);return}
 if(!data){
  const name=me.user_metadata?.full_name||me.email?.split('@')[0]||'کاربر ایتل';
  const {data:created,error:e}=await sb.from('aitel_profiles').insert({
   id:me.id,display_name:name,username:'user_'+me.id.slice(0,8)
  }).select().single();
  if(e){toast('ساخت پروفایل: '+e.message);return}
  data=created;
 }
 profile=data;renderMyProfile();
}
function renderMyProfile(){
 if(!profile)return;
 document.getElementById('myName').textContent=profile.display_name||profile.username||'کاربر';
 document.getElementById('myUsername').textContent=profile.username?'@'+profile.username:'حساب ایتل';
 document.getElementById('myAvatar').innerHTML=profile.avatar_url?`<img src="${esc(profile.avatar_url)}">`:esc(initials(profile.display_name));
}
function subscribeProfile(){
 if(profileChannel)sb.removeChannel(profileChannel);
 profileChannel=sb.channel('profile-'+me.id).on('postgres_changes',{
  event:'UPDATE',schema:'public',table:'aitel_profiles',filter:'id=eq.'+me.id
 },payload=>{profile=payload.new;renderMyProfile()}).subscribe();
}

/* گفتگوها */
async function loadChats(){
 const {data:members,error}=await sb.from('aitel_chat_members').select('chat_id').eq('user_id',me.id);
 if(error){toast('خطای دریافت عضویت‌ها: '+error.message);return}
 const ids=[...new Set((members||[]).map(x=>x.chat_id))];
 if(!ids.length){chats=[];renderChats();return}
 const {data,error:e}=await sb.from('aitel_chats')
  .select('id,title,is_group,created_by,created_at,updated_at')
  .in('id',ids).order('updated_at',{ascending:false});
 if(e){toast('خطای دریافت گفتگوها: '+e.message);return}
 chats=data||[];
 await Promise.all(chats.map(async c=>{
  const {count}=await sb.from('aitel_chat_members').select('*',{count:'exact',head:true}).eq('chat_id',c.id);
  c.member_count=count||0;
  if(!c.is_group){
   const {data:m}=await sb.from('aitel_chat_members').select('user_id').eq('chat_id',c.id).neq('user_id',me.id).limit(1).maybeSingle();
   if(m){
    const {data:p}=await sb.from('aitel_profiles').select('id,display_name,username,avatar_url,is_online,last_seen').eq('id',m.user_id).maybeSingle();
    c.peer=p||null;
   }
  }
  const {data:last}=await sb.from('aitel_messages').select('content,message_type,created_at')
   .eq('chat_id',c.id).is('deleted_at',null).order('created_at',{ascending:false}).limit(1).maybeSingle();
  c.last_message=last;
 }));
 renderChats();
}
function chatTitle(c){return c.is_group?(c.title||'گروه بدون نام'):(c.peer?.display_name||c.peer?.username||'گفتگوی خصوصی')}
function renderChats(){
 const list=document.getElementById('chatList');
 const q=(document.getElementById('chatSearch').value||'').toLowerCase();
 let arr=chats.filter(c=>{
  if(currentFilter==='groups'&&!c.is_group)return false;
  if(currentFilter==='channels'&&(!c.is_group||!c.chat_type?.includes('channel')))return false;
  return chatTitle(c).toLowerCase().includes(q);
 });
 if(!arr.length){list.innerHTML='<p class="muted" style="text-align:center;padding:25px">هنوز گفتگویی وجود ندارد.</p>';return}
 list.innerHTML=arr.map(c=>{
  const name=chatTitle(c),url=c.peer?.avatar_url;
  return `<div class="chatrow ${currentChat?.id===c.id?'active':''}" onclick="selectChat('${c.id}')">
   ${avatarMarkup(url,name)}
   <div class="chatinfo"><strong>${esc(name)}</strong><p>${esc(c.last_message?.content|| (c.is_group?'گروه ایتل':'گفتگوی جدید'))}</p></div>
   <div class="chatmeta">${formatTime(c.last_message?.created_at||c.updated_at)}</div>
  </div>`;
 }).join('');
}
async function selectChat(id){
 const c=chats.find(x=>x.id===id);if(!c)return;
 currentChat=c;
 document.body.classList.add('inchat');
 document.getElementById('welcome').style.display='none';
 document.getElementById('chatHeader').style.display='flex';
 document.getElementById('messages').style.display='flex';
 document.getElementById('composerArea').style.display='flex';
 document.getElementById('peerName').textContent=chatTitle(c);
 document.getElementById('peerAvatar').innerHTML=c.peer?.avatar_url?`<img src="${esc(c.peer.avatar_url)}">`:esc(initials(chatTitle(c)));
 document.getElementById('peerStatus').textContent=c.is_group?`${c.member_count} عضو`:(c.peer?.is_online?'آنلاین':'');
 renderChats();await loadMessages();
 if(messageChannel)sb.removeChannel(messageChannel);
 messageChannel=sb.channel('messages-'+id).on('postgres_changes',{
  event:'INSERT',schema:'public',table:'aitel_messages',filter:'chat_id=eq.'+id
 },payload=>appendMessage(payload.new)).subscribe();
}
function backToChats(){document.body.classList.remove('inchat')}
async function loadMessages(){
 const box=document.getElementById('messages');box.innerHTML='';
 const {data,error}=await sb.from('aitel_messages').select('*').eq('chat_id',currentChat.id)
  .is('deleted_at',null).order('created_at',{ascending:true}).limit(150);
 if(error){toast('خطای دریافت پیام‌ها: '+error.message);return}
 for(const m of data||[])await appendMessage(m,false);
 box.scrollTop=box.scrollHeight;
}
async function appendMessage(m,scroll=true){
 if(!m||!currentChat||m.chat_id!==currentChat.id)return;
 if(document.getElementById('msg-'+m.id))return;
 let content=esc(m.content||'');
 if(m.message_type==='image'&&m.media_path){
  const url=await mediaUrl(m.media_path);
  content=url?`<img src="${esc(url)}" alt="تصویر">`:'تصویر';
 }else if(m.message_type==='file'&&m.media_path){
  const url=await mediaUrl(m.media_path);
  content=`<a href="${esc(url||'#')}" target="_blank">📎 ${content||'دریافت فایل'}</a>`;
 }
 const mine=m.sender_id===me.id;
 const sender=mine?(profile?.display_name||'شما'):'';
 const html=document.createElement('div');
 html.className='msg '+(mine?'mine':'');
 html.id='msg-'+m.id;
 html.innerHTML=(sender?`<div class="sender">${esc(sender)}</div>`:'')+
  `<div>${content.replace(/\n/g,'<br>')}</div><div class="msgtime">${formatTime(m.created_at)} ${mine?'✓':''}</div>`;
 document.getElementById('messages').appendChild(html);
 if(scroll)document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
}
async function sendText(){
 const input=document.getElementById('messageInput');
 const content=input.value.trim();
 if(!content||!currentChat)return;
 input.value='';
 const {data,error}=await sb.from('aitel_messages').insert({
  chat_id:currentChat.id,sender_id:me.id,message_type:'text',content
 }).select().single();
 if(error){input.value=content;toast('ارسال پیام ناموفق بود: '+error.message);return}
 await appendMessage(data);
}
async function mediaUrl(path){
 if(!path)return null;
 const {data}=await sb.storage.from(MEDIA_BUCKET).createSignedUrl(path,3600);
 return data?.signedUrl||null;
}
async function uploadAndSend(file){
 if(!file||!currentChat)return;
 if(file.size>20*1024*1024){toast('حجم فایل نباید بیشتر از ۲۰ مگابایت باشد.');return}
 const path=me.id+'/'+Date.now()+'_'+file.name.replace(/[^\w.-]/g,'_');
 const {error}=await sb.storage.from(MEDIA_BUCKET).upload(path,file);
 if(error){toast('آپلود ناموفق: '+error.message);return}
 const type=file.type.startsWith('image/')?'image':'file';
 const {data,error:e}=await sb.from('aitel_messages').insert({
  chat_id:currentChat.id,sender_id:me.id,message_type:type,
  content:file.name,media_path:path,media_mime:file.type,media_size:file.size
 }).select().single();
 if(e){toast('ارسال فایل ناموفق: '+e.message);return}
 await appendMessage(data);
}

/* پروفایل */
function showProfile(){
 if(!profile)return;
 openModal(`<div class="modalhead"><h3>پروفایل من</h3><button class="iconbtn" onclick="closeModal()">×</button></div>
 <div style="display:flex;align-items:center;gap:12px;margin-bottom:15px">
 ${avatarMarkup(profile.avatar_url,profile.display_name)}
 <div><b>${esc(profile.display_name||'کاربر')}</b><div class="muted">@${esc(profile.username||'')}</div></div>
 </div>
 <div class="field"><label>نام نمایشی</label><input id="editName" value="${esc(profile.display_name||'')}"></div>
 <div class="field"><label>نام کاربری</label><input id="editUsername" value="${esc(profile.username||'')}"></div>
 <div class="field"><label>درباره من</label><textarea id="editBio" rows="3">${esc(profile.bio||'')}</textarea></div>
 <div class="field"><label>تصویر پروفایل</label><input type="file" id="avatarFile" accept="image/*"></div>
 <div class="modalactions"><button class="primarybtn" onclick="saveProfile()">ذخیره تغییرات</button><button class="secondarybtn" onclick="openThemes()">🎨 انتخاب تم</button><button class="secondarybtn" onclick="logout()">خروج از حساب</button></div>`);
}
async function saveProfile(){
 const display_name=document.getElementById('editName').value.trim();
 const username=document.getElementById('editUsername').value.trim().replace(/^@/,'');
 const bio=document.getElementById('editBio').value.trim();
 const file=document.getElementById('avatarFile').files[0];
 let avatar_url=profile.avatar_url;
 if(file){
  const path=me.id+'/'+Date.now()+'.'+(file.name.split('.').pop()||'jpg');
  const {error}=await sb.storage.from(AVATAR_BUCKET).upload(path,file,{upsert:true});
  if(error){toast('آپلود عکس: '+error.message);return}
  const {data}=sb.storage.from(AVATAR_BUCKET).getPublicUrl(path);
  avatar_url=data.publicUrl;
 }
 const {data,error}=await sb.from('aitel_profiles').update({display_name,username,bio,avatar_url}).eq('id',me.id).select().single();
 if(error){toast('ذخیره پروفایل: '+error.message);return}
 profile=data;renderMyProfile();closeModal();toast('پروفایل ذخیره شد');
}
async function logout(){
 await sb.auth.signOut();location.reload();
}

/* جست‌وجو و گفتگوی خصوصی */
function showNewChat(){
 openModal(`<div class="modalhead"><h3>گفتگوی جدید</h3><button class="iconbtn" onclick="closeModal()">×</button></div>
 <div class="field"><input id="userSearch" placeholder="نام یا نام کاربری را وارد کن..." oninput="searchUsers()"></div>
 <div id="userResults"><p class="muted">برای جست‌وجو تایپ کن.</p></div>`);
}
let searchTimer;
function searchUsers(){
 clearTimeout(searchTimer);
 searchTimer=setTimeout(runUserSearch,350);
}
async function runUserSearch(){
 const q=document.getElementById('userSearch')?.value.trim();
 const box=document.getElementById('userResults');if(!box)return;
 if(!q){box.innerHTML='';return}
 const {data,error}=await sb.from('aitel_profiles').select('id,username,display_name,avatar_url')
  .or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').neq('id',me.id).limit(20);
 if(error){box.textContent=error.message;return}
 profilesCache.clear();
 (data||[]).forEach(p=>profilesCache.set(p.id,p));
 box.innerHTML=(data||[]).map(p=>`<div class="chatrow" onclick="startDirect('${p.id}')">
 ${avatarMarkup(p.avatar_url,p.display_name)}
 <div class="chatinfo"><strong>${esc(p.display_name||p.username)}</strong><p>@${esc(p.username||'')}</p></div>
 <span>＋</span></div>`).join('')||'<p class="muted">کاربری پیدا نشد.</p>';
}
async function startDirect(otherId){
 const {data,error}=await sb.rpc('aitel_create_direct_chat',{p_other_user:otherId});
 if(error){toast('ساخت گفتگو ناموفق بود: '+error.message);return}
 closeModal();await loadChats();
 const id=typeof data==='string'?data:data?.id||data?.chat_id;
 if(id)selectChat(id);
 else toast('گفتگو ساخته شد؛ فهرست گفتگوها را بررسی کن.');
}

/* ساخت گروه */
function showCreateGroup(){
 openModal(`<div class="modalhead"><h3>ساخت گروه جدید</h3><button class="iconbtn" onclick="closeModal()">×</button></div>
 <div class="field"><label>نام گروه</label><input id="groupTitle" placeholder="مثلاً دوستان"></div>
 <div class="field"><label>شناسه اعضا، با کاما جدا کن</label><input id="groupMembers" placeholder="UUID کاربران"></div>
 <p class="muted">برای افزودن اعضا باید شناسه کاربری آن‌ها را داشته باشی.</p>
 <button class="primarybtn" onclick="createGroup()">ساخت گروه</button>`);
}
async function createGroup(){
 const title=document.getElementById('groupTitle').value.trim();
 if(!title){toast('نام گروه را وارد کن');return}
 const ids=[...new Set([me.id,...document.getElementById('groupMembers').value.split(',').map(x=>x.trim()).filter(Boolean)])];
 const {data:chat,error}=await sb.from('aitel_chats').insert({
  title,is_group:true,created_by:me.id
 }).select().single();
 if(error){toast('ساخت گروه: '+error.message);return}
 const rows=ids.map(user_id=>({chat_id:chat.id,user_id,role:user_id===me.id?'owner':'member',added_by:me.id}));
 const {error:e}=await sb.from('aitel_chat_members').insert(rows);
 if(e){toast('گروه ساخته شد، اما افزودن اعضا ناموفق بود: '+e.message);return}
 closeModal();await loadChats();selectChat(chat.id);toast('گروه ساخته شد');
}

/* ساخت کانال */
function showCreateChannel(){
 openModal(`<div class="modalhead"><h3>ساخت کانال</h3><button class="iconbtn" onclick="closeModal()">×</button></div>
 <div class="field"><label>نام کانال</label><input id="channelTitle" placeholder="نام کانال"></div>
 <div class="field"><label>توضیحات</label><textarea id="channelDescription" rows="3" placeholder="درباره کانال"></textarea></div>
 <button class="primarybtn" onclick="createChannel()">ساخت کانال</button>`);
}
async function createChannel(){
 const title=document.getElementById('channelTitle').value.trim();
 const description=document.getElementById('channelDescription').value.trim();
 if(!title){toast('نام کانال را وارد کن');return}
 const {data:chat,error}=await sb.from('aitel_chats').insert({
  title,is_group:true,created_by:me.id
 }).select().single();
 if(error){toast('ساخت کانال: '+error.message);return}
 const {error:e}=await sb.from('aitel_chat_members').insert({
  chat_id:chat.id,user_id:me.id,role:'owner',added_by:me.id
 });
 if(e){toast('کانال ساخته شد ولی عضویت مدیر ثبت نشد: '+e.message);return}
 /* توضیحات در metadata ذخیره نمی‌شود مگر ستون مناسب در دیتابیس وجود داشته باشد. */
 closeModal();await loadChats();selectChat(chat.id);toast('کانال ساخته شد');
}

/* اطلاعات گفتگو */
async function chatInfo(){
 if(!currentChat)return;
 const c=currentChat;
 openModal(`<div class="modalhead"><h3>اطلاعات گفتگو</h3><button class="iconbtn" onclick="closeModal()">×</button></div>
 <div style="display:flex;align-items:center;gap:12px">
 ${avatarMarkup(c.peer?.avatar_url,chatTitle(c))}
 <div><b>${esc(chatTitle(c))}</b><div class="muted">${c.is_group?'گروه / کانال':'گفتگوی خصوصی'}</div></div>
 </div>
 <p class="muted">شناسه گفتگو: ${esc(c.id)}</p>
 ${c.is_group?`<p>تعداد اعضای ثبت‌شده: ${c.member_count}</p>`:''}
 <button class="secondarybtn" onclick="copyChatId('${c.id}')">کپی شناسه گفتگو</button>`);
}
async function copyChatId(id){
 try{await navigator.clipboard.writeText(id);toast('شناسه کپی شد')}
 catch(e){toast(id)}
}

/* راه‌اندازی */
boot().catch(e=>toast('خطای راه‌اندازی: '+e.message));
</script>
