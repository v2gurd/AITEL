<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AITEL">
<meta name="description" content="AITEL Messenger | ارتباط، ساده‌تر از همیشه">
<title>AITEL | ایتل</title>
<link rel="apple-touch-icon" id="appleIcon">
<link rel="icon" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#f4f7ff;--panel:#fff;--text:#17243d;--muted:#8793a8;
--line:#e8edf6;--primary:#2878ed;--primary2:#55a1ff;
--soft:#eaf3ff;--green:#20b77a;--danger:#e45163;
--shadow:0 10px 35px rgba(30,75,140,.09);
--glass:0;--glass-blur:0px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:Vazirmatn,sans-serif;transition:background .25s,color .25s}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea{font-size:16px!important}
.material-symbols-rounded{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{width:370px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.top{padding:17px 18px 13px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:"Space Grotesk",sans-serif;font-size:27px;font-weight:700;color:var(--primary);letter-spacing:-1.5px}
.version{font-size:10px;color:var(--muted);margin-right:6px}
.brandline{display:flex;align-items:center;gap:9px}
.brandmark{width:38px;height:38px;border-radius:13px;background:white;display:grid;place-items:center;overflow:hidden;box-shadow:0 5px 13px #2878ed20}
.brandmark img{width:100%;height:100%;object-fit:contain}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--soft);color:var(--primary);display:grid;place-items:center}
.search{padding:0 15px 13px}
.search input{width:100%;border:0;outline:0;background:var(--bg);color:var(--text);border-radius:14px;padding:13px 15px}
.tabs{display:flex;padding:0 12px;gap:5px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:12px 4px;background:none;color:var(--muted);font-size:12px}
.tab.active{color:var(--primary);border-bottom:2px solid var(--primary);font-weight:800}
.list{overflow:auto;flex:1;padding:7px}
.item{display:flex;align-items:center;gap:11px;padding:11px;border-radius:15px;cursor:pointer}
.item:hover,.item.active{background:var(--soft)}
.avatar{width:48px;height:48px;flex-shrink:0;border-radius:17px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:white;font-size:17px;font-weight:800;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .material-symbols-rounded{font-size:27px;color:white}
.channel-avatar{background:var(--soft);padding:7px}
.channel-avatar img{width:100%;height:100%;object-fit:contain}
.channel-avatar .material-symbols-rounded{font-size:30px;color:var(--primary)}
.iteminfo{flex:1;min-width:0}
.itemname{font-size:14px;font-weight:800;display:flex;align-items:center;gap:5px;min-width:0}
.preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.badgecount{background:var(--primary);color:white;border-radius:20px;min-width:21px;height:21px;padding:0 6px;display:grid;place-items:center;font-size:10px}
.verified{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#2878ed;color:white;font-size:10px;flex-shrink:0}
.chatarea{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.empty{margin:auto;text-align:center;color:var(--muted)}
.empty .big{font-size:55px;color:var(--primary2)}
.chathead{height:72px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.chathead .name{font-weight:800;display:flex;align-items:center;gap:5px}
.chathead .sub{font-size:11px;color:var(--muted)}
.chathead .avatar{cursor:pointer}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--bg);scroll-behavior:smooth}
.msg{max-width:min(82%,540px);padding:10px 13px;border-radius:16px;background:var(--panel);box-shadow:0 2px 8px #00000008;align-self:flex-start;overflow-wrap:anywhere;position:relative}
.msg.mine{align-self:flex-end;background:var(--soft);border-bottom-right-radius:5px}
.msg .sender{font-size:11px;color:var(--primary);font-weight:800;margin-bottom:5px;cursor:pointer}
.msg .time{font-size:9px;color:var(--muted);text-align:left;margin-top:6px}
.msg .ticks{color:var(--primary);margin-right:4px}
.msg .edited{font-size:9px;color:var(--muted);margin-right:4px}
.msg.deleted{color:var(--muted);font-style:italic}
.msg-actions{display:flex;justify-content:flex-end;gap:5px;margin-top:7px;border-top:1px solid #00000008;padding-top:6px}
.msg-actions button{background:transparent;color:var(--muted);font-size:10px;padding:3px 5px}
.msg-actions button:hover{color:var(--primary)}
.replyquote{border-right:3px solid var(--primary);background:var(--soft);border-radius:8px;padding:7px 9px;margin-bottom:7px;font-size:11px;cursor:pointer;color:var(--muted)}
.replyquote b{display:block;color:var(--primary);margin-bottom:3px}
.replyquote span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.replybar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--soft);border-top:1px solid var(--line)}
.replybar .replytext{flex:1;min-width:0;font-size:11px;color:var(--muted)}
.replybar b{display:block;color:var(--primary);margin-bottom:2px}
.replybar button{background:none;color:var(--muted);font-size:18px}
.composer{padding:12px 15px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}
.composer input{flex:1;min-width:0;border:0;outline:0;background:var(--bg);color:var(--text);border-radius:20px;padding:13px 17px}
.send{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;display:grid;place-items:center;box-shadow:0 5px 13px #2878ed30}
.readonly{padding:15px;background:var(--panel);border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px}
.login{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{background:var(--panel);border-radius:28px;padding:34px 25px;width:min(390px,100%);text-align:center;box-shadow:var(--shadow)}
.loginlogo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:15px}
.loginlogo .brandmark{width:58px;height:58px;border-radius:19px}
.loginlogo span{font-family:"Space Grotesk";font-size:42px;font-weight:700;color:var(--primary)}
.google{width:100%;padding:14px;border-radius:14px;background:var(--primary);color:white;font-weight:800;margin-top:20px}
.hidden{display:none!important}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#17243d;color:white;padding:12px 18px;border-radius:13px;font-size:12px;z-index:99;box-shadow:var(--shadow);max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:#11182777;z-index:30;display:flex;align-items:center;justify-content:center;padding:15px;backdrop-filter:blur(8px)}
.modalbox{width:min(500px,100%);max-height:90dvh;overflow:auto;background:var(--panel);color:var(--text);border-radius:23px;padding:20px;box-shadow:var(--shadow)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.channelcard{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:15px;margin-bottom:9px}
.channelcard .details{flex:1;min-width:0}
.channelcard b{font-size:13px}
.channelcard small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.join{background:var(--soft);color:var(--primary);padding:8px 12px;border-radius:10px;font-size:11px;font-weight:800}
.join.joined{background:#e9f8f1;color:#159664}
.profile{padding:15px;text-align:center}
.profile input,.profile textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:11px;margin-top:10px;outline:0}
.profile textarea{min-height:75px}
.primary{background:var(--primary);color:white;padding:12px 17px;border-radius:12px;font-weight:800}
.dangerbtn{background:#fff0f1;color:#d44;padding:11px 15px;border-radius:12px;font-weight:800}
.back{display:none}
.profile-action{width:100%;margin-top:10px}
.realtime-status{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:5px;background:#20b77a}
.realtime-status.off{background:#e45163}
.profile-footer{display:flex;align-items:center;gap:9px;padding:12px;border-top:1px solid var(--line)}
.profile-footer .user-details{flex:1;min-width:0;cursor:pointer}
.profile-footer button{flex-shrink:0}

/* گالری عکس پروفایل */
.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:15px 0}
.gallery-photo{position:relative;aspect-ratio:1;border-radius:15px;overflow:hidden;background:var(--soft);border:2px solid transparent}
.gallery-photo.selected{border-color:var(--primary)}
.gallery-photo img{width:100%;height:100%;object-fit:cover}
.gallery-photo button{position:absolute;top:5px;left:5px;width:27px;height:27px;border-radius:9px;background:#17243dcc;color:white;display:grid;place-items:center}
.gallery-photo .main-tag{position:absolute;bottom:5px;right:5px;background:var(--primary);color:white;font-size:9px;padding:4px 7px;border-radius:8px}
.upload-label{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1px dashed var(--primary);color:var(--primary);background:var(--soft);border-radius:13px;font-size:12px;font-weight:800;cursor:pointer}
.upload-label input{display:none}
.photo-note{font-size:10px;color:var(--muted);line-height:1.8;margin-top:8px}

/* تنظیمات و تم */
.settings-section{padding:12px 0;border-bottom:1px solid var(--line)}
.settings-title{font-size:12px;font-weight:900;margin-bottom:10px}
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.theme-option{border:1px solid var(--line);border-radius:13px;padding:8px;background:var(--bg);color:var(--text);text-align:center;font-size:10px}
.theme-option.active{border:2px solid var(--primary);padding:7px}
.theme-preview{height:42px;border-radius:9px;margin-bottom:6px;display:flex;overflow:hidden}
.theme-preview i{flex:1}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;font-size:12px;gap:10px}
.setting-row button{background:var(--soft);color:var(--primary);padding:8px 12px;border-radius:10px;font-size:11px}
.glass-mode{
--glass:1;
}
.glass-mode .sidebar,.glass-mode .chathead,.glass-mode .composer,.glass-mode .modalbox,.glass-mode .loginbox,.glass-mode .profile-footer{
background:color-mix(in srgb,var(--panel) 70%,transparent);
backdrop-filter:blur(24px) saturate(180%);
-webkit-backdrop-filter:blur(24px) saturate(180%);
border:1px solid #ffffff70;
}
.glass-mode .item.active,.glass-mode .item:hover,.glass-mode .msg,.glass-mode .iconbtn{
backdrop-filter:blur(16px) saturate(170%);
-webkit-backdrop-filter:blur(16px) saturate(170%);
background:color-mix(in srgb,var(--soft) 68%,transparent);
}
.glass-mode .messages{background:linear-gradient(135deg,color-mix(in srgb,var(--bg) 70%,transparent),color-mix(in srgb,var(--primary) 8%,var(--bg)))}
.glass-mode .msg.mine{background:color-mix(in srgb,var(--primary) 17%,transparent)}
.glass-mode .modal{background:#0c1a2c55}
.glass-mode .avatar{box-shadow:inset 0 1px 1px #ffffff90,0 5px 15px #00000012}
.glass-mode .brandmark{backdrop-filter:blur(18px)}
@media(max-width:700px){
.sidebar{width:100%;border:0}.chatarea{display:none}
.app.chat-open .sidebar{display:none}.app.chat-open .chatarea{display:flex}
.chathead{height:64px;padding:0 12px}.messages{padding:13px}
.back{display:grid!important}.msg{max-width:88%}
}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="sidebar">
<div class="top">
<div class="brandline">
<div class="brandmark"><img src="AITEL-Official-Logo.png" alt="AITEL"></div>
<div><span class="brand">AITEL</span><span class="version">v1.4</span></div>
</div>
<button class="iconbtn" onclick="openChannels()" title="کانال‌ها"><span class="material-symbols-rounded">campaign</span></button>
</div>
<div class="search"><input id="searchInput" placeholder="جست‌وجوی گفتگو، کانال یا کاربر..." oninput="renderList()"></div>
<div class="tabs">
<button class="tab active" onclick="switchTab('chats',this)">گفتگوها</button>
<button class="tab" onclick="switchTab('channels',this)">کانال‌ها</button>
<button class="tab" onclick="switchTab('groups',this)">گروه‌ها</button>
</div>
<div class="list" id="list"></div>
<div class="profile-footer">
<div class="avatar" id="myAvatar" style="width:42px;height:42px" onclick="openProfile()"> </div>
<div class="user-details" onclick="openProfile()">
<b id="myName" style="font-size:13px">پروفایل من</b>
<div id="myUsername" style="font-size:10px;color:var(--muted)">تنظیم حساب</div>
</div>
<button class="iconbtn" onclick="openSettings()" title="تنظیمات"><span class="material-symbols-rounded">settings</span></button>
<button class="iconbtn" onclick="openProfile()" title="مدیریت پروفایل"><span class="material-symbols-rounded">manage_accounts</span></button>
</div>
</aside>
<main class="chatarea" id="chatArea">
<div class="empty">
<div class="big"><span class="material-symbols-rounded" style="font-size:60px">forum</span></div>
<b>به ایتل خوش آمدید</b>
<p style="font-size:12px">برای شروع یک گفتگو را انتخاب کنید.</p>
</div>
</main>
</div>

<div class="login hidden" id="login">
<div class="loginbox">
<div class="loginlogo">
<div class="brandmark"><img src="AITEL-Official-Logo.png" alt="AITEL"></div>
<span>AITEL</span>
</div>
<h2>ارتباط، ساده‌تر از همیشه</h2>
<p style="color:var(--muted);font-size:13px">وارد حساب خود شوید و گفتگو را آغاز کنید.</p>
<button class="google" onclick="loginGoogle()">ورود با حساب Google</button>
<p style="font-size:10px;color:var(--muted);margin-top:20px">AITEL Messenger · v1.4</p>
</div>
</div>
<div class="modal hidden" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modalbox" id="modalContent"></div>
</div>
<div class="toast hidden" id="toast"></div>

<script>
const SUPABASE_URL='https://psvesfkxtmlnjyhphsfs.supabase.co';
const SUPABASE_KEY='sb_publishable_QClWgLVOmPGwPK_kTsL5UA_L0cNqJ4H';
const SITE_URL='https://v2gurd.github.io/AITEL/';
const LOGO_URL=SITE_URL+'AITEL-Official-Logo.png';
const PHOTO_BUCKET='aitel-profile-photos';

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'pkce'}
});

let currentUser=null,myProfile=null,currentChat=null,currentTab='chats';
let myChats=[],channels=[],memberships=[],unreadMap={},realtime=null;
let replyTarget=null,messageCache=[],chatProfiles={};
let messageLoadRunning=false,messageLoadRequested=false,messageLoadChatId=null;
let notificationCount=0;
let profilePhotos=[];

const $=id=>document.getElementById(id);
const MATERIAL={
game:'sports_esports',nature:'forest',world:'public',education:'school',
tech:'memory',ai:'smart_toy',science:'biotech',movies:'movie',
music:'headphones',photo:'photo_camera',news:'newspaper',knowledge:'psychology',
space:'rocket_launch',cars:'directions_car',sports:'sports_soccer',
fun:'celebration',history:'account_balance',code:'code',art:'palette',life:'lightbulb'
};

const CHANNEL_TOPICS=[
{key:'game',terms:['گیم','بازی','گیمینگ']},
{key:'nature',terms:['طبیعت','حیات','وحش']},
{key:'world',terms:['جنگ','جهان','اخبار جهان']},
{key:'education',terms:['آموزش']},
{key:'tech',terms:['تکنولوژی','فناوری']},
{key:'ai',terms:['هوش مصنوعی']},
{key:'science',terms:['علم','کشف']},
{key:'movies',terms:['فیلم','سریال']},
{key:'music',terms:['موسیقی']},
{key:'photo',terms:['عکاسی']},
{key:'news',terms:['اخبار']},
{key:'knowledge',terms:['دانستنی']},
{key:'space',terms:['فضا','نجوم']},
{key:'cars',terms:['خودرو','ماشین']},
{key:'sports',terms:['ورزش']},
{key:'fun',terms:['سرگرمی']},
{key:'history',terms:['تاریخ']},
{key:'code',terms:['برنامه‌نویسی','برنامه نویسی']},
{key:'art',terms:['هنر','طراحی']},
{key:'life',terms:['مهارت','زندگی']}
];

/* ۶۰ تم اختصاصی */
const THEME_BASES=[
['آبی کلاسیک','#f4f7ff','#ffffff','#17243d','#2878ed','#55a1ff'],
['شب آبی','#101a2b','#17263c','#eef5ff','#4d9bff','#8bc5ff'],
['مشکی لوکس','#111111','#1d1d1d','#f4f4f4','#d4af37','#f1d98a'],
['بنفش رویایی','#f5f0ff','#ffffff','#30204e','#8055dc','#b79aff'],
['صورتی ملایم','#fff2f7','#ffffff','#492a3c','#e56b9c','#f5a4c4'],
['سبز جنگلی','#edf6f0','#ffffff','#1c3829','#268653','#75c79a'],
['قرمز مدرن','#fff1f1','#ffffff','#401f25','#d94352','#ff858c'],
['طلایی روشن','#faf5e9','#ffffff','#44371f','#b88b2d','#e6bd62'],
['فیروزه‌ای','#eafafa','#ffffff','#173e40','#16a6a6','#6bd8d0'],
['خاکستری مینیمال','#f1f2f4','#ffffff','#24262a','#555e6b','#929eae']
];
const THEMES=[];
for(let group=0;group<THEME_BASES.length;group++){
 for(let variant=0;variant<6;variant++){
  const b=THEME_BASES[group];
  THEMES.push({
   id:'theme'+(group*6+variant+1),
   name:b[0]+' '+(variant+1),
   bg:variant%2===0?b[1]:b[2],
   panel:variant%2===0?b[2]:b[1],
   text:b[3],primary:b[4],primary2:b[5]
  });
 }
}
const GLASS_THEME={id:'liquid-glass',name:'Liquid Glass آیفون',bg:'#eaf1fa',panel:'#ffffffaa',text:'#17243d',primary:'#397fe8',primary2:'#83baff'};

function topicFor(channel){
 const title=(channel?.title||'').toLowerCase();
 return CHANNEL_TOPICS.find(t=>t.terms.some(term=>title.includes(term)))?.key||'knowledge';
}
function materialIcon(name){
 return `<span class="material-symbols-rounded">${escapeHTML(name)}</span>`;
}
function channelAvatar(channel){
 if(channel?.is_official)return logoSmall();
 const key=topicFor(channel);
 return `<div style="width:100%;height:100%;display:grid;place-items:center">${materialIcon(MATERIAL[key]||'interests')}</div>`;
}
function toast(message){
 const el=$('toast');el.textContent=message;el.classList.remove('hidden');
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3500);
}
function escapeHTML(value=''){
 return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeText(value){
 if(!value)return '';
 return new Date(value).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
}
function avatarHTML(profile){
 if(profile?.avatar_url)return `<img src="${escapeHTML(profile.avatar_url)}" alt="" onerror="this.style.display='none'">`;
 return escapeHTML((profile?.display_name||profile?.title||'ا').slice(0,1));
}
function logoSmall(){
 return `<img src="${LOGO_URL}" alt="AITEL" style="width:100%;height:100%;object-fit:contain">`;
}
function verifiedMark(){return '<span class="verified" title="تأیید شده">✓</span>'}
function showModal(html){$('modalContent').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}

function setupBrandAssets(){
 $('favicon').href=LOGO_URL;$('appleIcon').href=LOGO_URL;

/* مدیریت تم */
function applyTheme(themeId){
 const theme=themeId==='liquid-glass'?GLASS_THEME:THEMES.find(t=>t.id===themeId)||THEMES[0];
 const root=document.documentElement;
 root.style.setProperty('--bg',theme.bg);
 root.style.setProperty('--panel',theme.panel);
 root.style.setProperty('--text',theme.text);
 root.style.setProperty('--primary',theme.primary);
 root.style.setProperty('--primary2',theme.primary2);
 root.style.setProperty('--soft',theme.primary+'18');
 document.body.classList.toggle('glass-mode',themeId==='liquid-glass');
 localStorage.setItem('aitel-theme',themeId);
 if(myProfile&&currentUser){
  db.from('aitel_profiles').update({theme_id:themeId}).eq('id',currentUser.id).then(({error})=>{if(error)console.warn(error.message)});
 }
}
function loadTheme(){
 const id=myProfile?.theme_id||localStorage.getItem('aitel-theme')||'theme1';
 applyTheme(id);
}
function openSettings(){
 const current=localStorage.getItem('aitel-theme')||myProfile?.theme_id||'theme1';
 let html=`<div class="modalhead"><b>تنظیمات AITEL</b><button class="iconbtn" onclick="closeModal()">${materialIcon('close')}</button></div>
 <div class="settings-section">
 <div class="settings-title">ظاهر و شخصی‌سازی</div>
 <div class="setting-row"><span>تم شیشه‌ای Liquid Glass</span><button onclick="applyTheme('liquid-glass');openSettings()">فعال‌سازی</button></div>
 <div class="setting-row"><span>۶۰ تم اختصاصی ایتل</span><span style="color:var(--muted)">انتخاب تم</span></div>
 <div class="theme-grid">`;
 THEMES.forEach(t=>{
  html+=`<button class="theme-option ${current===t.id?'active':''}" onclick="applyTheme('${t.id}');openSettings()">
  <div class="theme-preview" style="background:${t.bg}"><i style="background:${t.primary}"></i><i style="background:${t.panel}"></i><i style="background:${t.primary2}"></i></div>${escapeHTML(t.name)}</button>`;
 });
 html+=`<button class="theme-option ${current==='liquid-glass'?'active':''}" onclick="applyTheme('liquid-glass');openSettings()">
 <div class="theme-preview" style="background:linear-gradient(135deg,#dceaffaa,#ffffff88);backdrop-filter:blur(10px)"><i style="background:#397fe8"></i><i style="background:#ffffff99"></i><i style="background:#83baff"></i></div>Liquid Glass</button>
 </div></div>
 <div class="settings-section">
 <div class="settings-title">اعلان‌ها</div>
 <div class="setting-row"><span>فعال‌سازی اعلان‌ها</span><button onclick="enableNotifications()">فعال‌سازی</button></div>
 </div>
 <div class="settings-section">
 <div class="settings-title">حساب کاربری</div>
 <div class="setting-row"><span>مدیریت پروفایل و عکس‌ها</span><button onclick="openProfile()">باز کردن</button></div>
 <div class="setting-row"><span>افزودن AITEL به صفحه اصلی</span><button onclick="installApp()">نصب برنامه</button></div>
 <div class="setting-row"><span>خروج از حساب</span><button style="color:#d44" onclick="logout()">خروج</button></div>
 </div>`;

/* OAuth */
async function loginGoogle(){
 const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:SITE_URL,queryParams:{access_type:'offline',prompt:'select_account'}}});
 if(error)toast('خطا در ورود: '+error.message);
}
async function handleOAuth(){
 const params=new URLSearchParams(location.search),code=params.get('code');
 if(code){
  const {error}=await db.auth.exchangeCodeForSession(code);
  if(error)toast('خطای ورود گوگل: '+error.message);

}

/* پروفایل */
async function loadProfile(){
 const {data,error}=await db.from('aitel_profiles').select('*').eq('id',currentUser.id).maybeSingle();
 if(error){console.error(error);toast('خطای دریافت پروفایل: '+error.message)}
 if(data)myProfile=data;
 else{
  const displayName=currentUser.user_metadata?.full_name||currentUser.email?.split('@')[0]||'کاربر ایتل';
  const username='user_'+currentUser.id.replaceAll('-','').slice(0,10);
  const {data:newProfile,error:insertError}=await db.from('aitel_profiles').insert({id:currentUser.id,display_name:displayName,username,bio:'',photo_urls:[]}).select().single();
  if(insertError){toast('ساخت پروفایل ناموفق بود: '+insertError.message);return}
  myProfile=newProfile;
 }
 if(!myProfile)return;
 profilePhotos=Array.isArray(myProfile.photo_urls)?myProfile.photo_urls:[];
 $('myName').textContent=myProfile.display_name;
 $('myUsername').textContent='@'+(myProfile.username||'');
 $('myAvatar').innerHTML=avatarHTML(myProfile);
 loadTheme();
}

/* گالری عکس‌های پروفایل */
function getPhotoList(){
 const list=Array.isArray(profilePhotos)?profilePhotos:[];
 if(myProfile?.avatar_url&&!list.includes(myProfile.avatar_url))list.unshift(myProfile.avatar_url);
 return [...new Set(list)];
}
function renderPhotoGallery(){
 const photos=getPhotoList();
 if(!photos.length)return '<div style="font-size:11px;color:var(--muted);padding:15px">هنوز عکسی اضافه نکرده‌اید.</div>';
 return `<div class="gallery-grid">${photos.map((url,i)=>`
 <div class="gallery-photo ${myProfile?.avatar_url===url?'selected':''}">
 <img src="${escapeHTML(url)}" alt="عکس پروفایل ${i+1}">
 ${myProfile?.avatar_url===url?'<span class="main-tag">عکس اصلی</span>':`<button onclick="setMainPhoto('${encodeURIComponent(url)}')" title="انتخاب عکس اصلی">${materialIcon('star')}</button>`}
 <button style="left:auto;right:5px" onclick="removeProfilePhoto('${encodeURIComponent(url)}')" title="حذف عکس">${materialIcon('delete')}</button>
 </div>`).join('')}</div>`;
}
async function uploadProfilePhotos(files){
 if(!files||!files.length)return;
 const current=getPhotoList();
 for(const file of [...files]){
  if(!file.type.startsWith('image/')){toast('فقط فایل تصویری قابل قبول است');continue}
  if(file.size>5*1024*1024){toast('حجم هر عکس باید کمتر از ۵ مگابایت باشد');continue}
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
  const path=`${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const {error}=await db.storage.from(PHOTO_BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});
  if(error){toast('آپلود عکس ناموفق بود: '+error.message);continue}
  const {data}=db.storage.from(PHOTO_BUCKET).getPublicUrl(path);
  if(data?.publicUrl&&!current.includes(data.publicUrl))current.push(data.publicUrl);
 }
 profilePhotos=current;
 const primary=myProfile?.avatar_url||current[0]||null;
 const {data,error}=await db.from('aitel_profiles').update({photo_urls:current,avatar_url:primary}).eq('id',currentUser.id).select().single();
 if(error){toast('ذخیره گالری ناموفق بود: '+error.message);return}
 myProfile=data;profilePhotos=current;
 $('myAvatar').innerHTML=avatarHTML(myProfile);
 openProfile();toast('عکس‌ها به گالری اضافه شدند؛ عکس‌های قبلی حفظ شدند.');
}
async function setMainPhoto(encoded){
 const url=decodeURIComponent(encoded);
 const photos=getPhotoList();
 if(!photos.includes(url))return;
 const {data,error}=await db.from('aitel_profiles').update({avatar_url:url,photo_urls:photos}).eq('id',currentUser.id).select().single();
 if(error){toast('تغییر عکس اصلی ناموفق بود: '+error.message);return}
 myProfile=data;profilePhotos=photos;$('myAvatar').innerHTML=avatarHTML(myProfile);
 openProfile();toast('عکس اصلی پروفایل تغییر کرد');
}
async function removeProfilePhoto(encoded){
 const url=decodeURIComponent(encoded);
 if(!confirm('این عکس از گالری پروفایل حذف شود؟'))return;
 const photos=getPhotoList().filter(x=>x!==url);
 const avatar= myProfile?.avatar_url===url?(photos[0]||null):myProfile.avatar_url;
 const {data,error}=await db.from('aitel_profiles').update({photo_urls:photos,avatar_url:avatar}).eq('id',currentUser.id).select().single();
 if(error){toast('حذف عکس ناموفق بود: '+error.message);return}
 myProfile=data;profilePhotos=photos;$('myAvatar').innerHTML=avatarHTML(myProfile);
 openProfile();toast('عکس از گالری حذف شد');
}

/* کانال‌ها */
async function loadChannels(){
 const {data,error}=await db.from('aitel_public_channels').select('*').order('created_at',{ascending:true});
 if(error){console.error(error);toast('دریافت کانال‌ها ناموفق بود: '+error.message);channels=[]}
 else channels=data||[];
 const {data:official,error:officialError}=await db.from('aitel_chats').select('id,title,description,is_official,is_verified,chat_type,created_by').eq('is_official',true).limit(1).maybeSingle();
 if(officialError)console.warn(officialError.message);
 if(official){
  const existing=channels.find(c=>c.chat_id===official.id);
  if(existing){existing.is_official=true;existing.is_verified=true;existing.title=official.title||existing.title}
  else channels.unshift({chat_id:official.id,title:official.title||'کانال رسمی ایتل',description:official.description||'کانال رسمی پیام‌رسان ایتل',icon:'',target_members:5000,is_official:true,is_verified:true});
 }
}
async function loadMemberships(){
 const {data,error}=await db.from('aitel_chat_members').select('chat_id,user_id,role,last_read_at,joined_at').eq('user_id',currentUser.id);
 if(error){console.error(error);toast('دریافت عضویت‌ها ناموفق بود: '+error.message);return}
 memberships=data||[];
}
function isChannelChat(chatId,type){return type==='channel'||channels.some(c=>c.chat_id===chatId)}
function channelFor(chatId){return channels.find(c=>c.chat_id===chatId)||null}
function membershipFor(chatId){return memberships.find(m=>m.chat_id===chatId)||null}
function canSendInCurrentChat(){
 if(!currentChat)return false;
 if(!isChannelChat(currentChat.id,currentChat.type))return true;
 const membership=membershipFor(currentChat.id),chat=myChats.find(c=>c.id===currentChat.id);
 return !!(membership&&(membership.role==='owner'||membership.role==='admin'||chat?.created_by===currentUser.id));
}

/* دریافت پیوی‌ها */
async function loadDirectProfiles(chatIds){
 chatProfiles={};
 const directChats=myChats.filter(c=>chatIds.includes(c.id)&&c.chat_type==='direct');
 if(!directChats.length)return;
 const ids=directChats.map(c=>c.id);
 const {data:members,error}=await db.from('aitel_chat_members').select('chat_id,user_id').in('chat_id',ids);
 if(error){console.warn(error.message);return}
 const otherIds=[...new Set((members||[]).filter(m=>m.user_id!==currentUser.id).map(m=>m.user_id))];
 if(!otherIds.length)return;
 const {data:profiles,error:profileError}=await db.from('aitel_profiles').select('id,username,display_name,avatar_url,bio,is_verified').in('id',otherIds);
 if(profileError){console.warn(profileError.message);return}
 const map={};(profiles||[]).forEach(p=>map[p.id]=p);
 (members||[]).forEach(m=>{if(m.user_id!==currentUser.id&&map[m.user_id])chatProfiles[m.chat_id]=map[m.user_id]});
}

/* عضویت کانال */
async function joinChannel(channel){
 if(!channel)return;
 if(membershipFor(channel.chat_id)){await openChat(channel.chat_id,channel.title,'channel');return}
 const {error}=await db.from('aitel_chat_members').insert({chat_id:channel.chat_id,user_id:currentUser.id,role:'member'});
 if(error){
  if(error.code==='23505'){await loadMemberships();if(membershipFor(channel.chat_id)){await openChat(channel.chat_id,channel.title,'channel');return}}
  toast('عضویت انجام نشد: '+error.message);return;
 }
 toast('با موفقیت عضو کانال شدید');
 await loadMemberships();await loadUnread();await loadChats();
 await openChat(channel.chat_id,channel.title,'channel');
}
async function leaveChannel(chatId){
 const channel=channelFor(chatId);
 if(channel?.is_official){toast('کانال رسمی ایتل قابل ترک نیست');return}
 if(!membershipFor(chatId)){toast('شما عضو این کانال نیستید');return}
 if(!confirm('از عضویت این کانال خارج می‌شوید؟'))return;
 const {error}=await db.from('aitel_chat_members').delete().eq('chat_id',chatId).eq('user_id',currentUser.id);
 if(error){toast('خروج ناموفق بود: '+error.message);return}
 if(currentChat?.id===chatId)closeChat();
 await loadMemberships();await loadUnread();await loadChats();
 toast('از کانال خارج شدید');renderList();
}

/* گفتگوها */
async function loadChats(){
 const ids=memberships.map(m=>m.chat_id);
 if(!ids.length){myChats=[];chatProfiles={};renderList();return}
 const {data,error}=await db.from('aitel_chats').select('*').in('id',ids).order('updated_at',{ascending:false});
 if(error){console.error(error);toast('دریافت گفتگوها ناموفق بود: '+error.message);return}
 myChats=data||[];
 myChats.forEach(c=>{if(channelFor(c.id))c.chat_type='channel'});
 await loadDirectProfiles(ids);renderList();
}

/* خوانده‌نشده‌ها */
async function loadUnread(){
 unreadMap={};
 for(const membership of memberships){
  const lastRead=membership.last_read_at||membership.joined_at||'1970-01-01';
  const {count,error}=await db.from('aitel_messages').select('*',{count:'exact',head:true}).eq('chat_id',membership.chat_id).neq('sender_id',currentUser.id).gt('created_at',lastRead);
  if(!error)unreadMap[membership.chat_id]=count||0;
 }
 updatePageTitle();renderList();
}
function updatePageTitle(){
 const total=Object.values(unreadMap).reduce((a,b)=>a+b,0);
 document.title=total?`(${total}) AITEL | ایتل`:'AITEL | ایتل';
}

/* فهرست */
function renderList(){
 const list=$('list'),q=$('searchInput').value.trim().toLowerCase();let html='';
 if(currentTab==='channels'){
  channels.filter(c=>(c.title+' '+(c.description||'')).toLowerCase().includes(q)).forEach(c=>{
   const joined=!!membershipFor(c.chat_id);
   html+=`<div class="item" onclick="joinChannelById('${c.chat_id}')">
   <div class="avatar channel-avatar">${c.is_official?logoSmall():channelAvatar(c)}</div>
   <div class="iteminfo"><div class="itemname">${escapeHTML(c.title)} ${c.is_official?verifiedMark():''}</div>
   <div class="preview">${escapeHTML(c.description||'کانال عمومی ایتل')}</div></div>
   <span class="badgecount" style="background:${joined?'#e9f8f1':'var(--soft)'};color:${joined?'#159664':'var(--primary)'}">${joined?'عضو':'+'}</span></div>`;
  });
 }else{
  const filtered=myChats.filter(c=>{
   if(currentTab==='groups'&&c.chat_type!=='group')return false;
   if(currentTab==='chats'&&(c.chat_type==='channel'||c.chat_type==='group'))return false;
   const person=chatProfiles[c.id],label=c.chat_type==='direct'?(person?.display_name||'گفتگوی خصوصی'):(c.title||'گفتگو');
   return (label+' '+(person?.username||'')).toLowerCase().includes(q);
  });
  filtered.forEach(c=>{
   const channel=channelFor(c.id),person=chatProfiles[c.id],unread=unreadMap[c.id]||0;
   const title=c.chat_type==='direct'?(person?.display_name||'کاربر ایتل'):(c.title||'گفتگو');
   let avatar=c.chat_type==='direct'?avatarHTML(person):channel?(channel.is_official?logoSmall():channelAvatar(channel)):c.chat_type==='group'?materialIcon('groups'):materialIcon('person');
   html+=`<div class="item ${currentChat?.id===c.id?'active':''}" onclick="openChat('${c.id}','${escapeHTML(title)}','${c.chat_type}')">
   <div class="avatar ${channel?'channel-avatar':''}">${avatar}</div>
   <div class="iteminfo"><div class="itemname">${escapeHTML(title)} ${c.is_verified||channel?.is_official?verifiedMark():''}</div>
   <div class="preview">${c.chat_type==='channel'?'کانال':c.chat_type==='group'?'گروه':person?.username?'@'+escapeHTML(person.username):'گفتگوی خصوصی'}</div></div>
   ${unread?`<span class="badgecount">${unread}</span>`:''}</div>`;
  });
 }
 if(!html)html='<div style="text-align:center;color:var(--muted);padding:35px 10px;font-size:12px">موردی برای نمایش وجود ندارد</div>';
 list.innerHTML=html;
}
function switchTab(tab,button){
 currentTab=tab;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 button.classList.add('active');renderList();
}
async function joinChannelById(id){const channel=channelFor(id);if(channel)await joinChannel(channel)}

/* بازکردن گفتگو */
async function openChat(id,title,type='direct'){
 replyTarget=null;const channel=channelFor(id);if(channel)type='channel';
 const chatRecord=myChats.find(c=>c.id===id);
 currentChat={id,title,type,created_by:chatRecord?.created_by||null};
 $('app').classList.add('chat-open');
 const person=type==='direct'?chatProfiles[id]:null,official=!!channel?.is_official;
 const displayTitle=type==='direct'?(person?.display_name||title):title;
 const avatar=type==='direct'?avatarHTML(person):official?logoSmall():channel?channelAvatar(channel):type==='group'?materialIcon('groups'):materialIcon('person');
 const allowed=canSendInCurrentChat();
 $('chatArea').innerHTML=`<div class="chathead">
 <button class="iconbtn back" onclick="closeChat()">${materialIcon('arrow_back')}</button>
 <div class="avatar ${channel?'channel-avatar':''}" style="width:43px;height:43px" onclick="${type==='direct'&&person?`openUserProfile('${person.id}')`:''}">${avatar}</div>
 <div style="flex:1;min-width:0;cursor:pointer" onclick="${type==='direct'&&person?`openUserProfile('${person.id}')`:''}">
 <div class="name">${escapeHTML(displayTitle)} ${official?verifiedMark():''}</div>
 <div class="sub"><span class="realtime-status" id="realtimeDot"></span>${type==='channel'?(official?'کانال رسمی AITEL':'کانال عمومی ایتل'):type==='group'?'گروه ایتل':person?.username?'@'+escapeHTML(person.username):'گفتگوی خصوصی'}</div></div>
 <button class="iconbtn" onclick="chatInfo()">${materialIcon('more_vert')}</button></div>
 <div class="messages" id="messages"><div class="empty">در حال دریافت پیام‌ها...</div></div>
 <div id="replyContainer"></div>
 ${allowed?`<div class="composer"><input id="messageInput" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"><button class="send" onclick="sendMessage()">${materialIcon('send')}</button></div>`:`<div class="readonly">${materialIcon('lock')} ارسال پیام در این کانال فقط برای مدیران مجاز است.</div>`}`;
 await markRead(id);await loadMessages(id);renderList();
}
function closeChat(){
 $('app').classList.remove('chat-open');currentChat=null;replyTarget=null;messageCache=[];
 $('chatArea').innerHTML=`<div class="empty"><div class="big">${materialIcon('forum')}</div><b>به ایتل خوش آمدید</b><p style="font-size:12px">برای شروع یک گفتگو را انتخاب کنید.</p></div>`;
}
async function markRead(chatId){
 const {error}=await db.from('aitel_chat_members').update({last_read_at:new Date().toISOString()}).eq('chat_id',chatId).eq('user_id',currentUser.id);
 if(error)console.warn('markRead:',error.message);
 unreadMap[chatId]=0;updatePageTitle();renderList();
}

/* پیام‌ها */
async function loadMessages(chatId){
 messageLoadRequested=true;messageLoadChatId=chatId;
 if(messageLoadRunning)return;messageLoadRunning=true;
 try{
  while(messageLoadRequested){
   messageLoadRequested=false;const targetId=messageLoadChatId,box=$('messages');
   if(!box||currentChat?.id!==targetId)continue;
   const wasNearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<130;
   const {data,error}=await db.from('aitel_messages').select('*').eq('chat_id',targetId).order('created_at',{ascending:true}).limit(100);
   if(error){
    if(currentChat?.id===targetId)box.innerHTML=`<div style="text-align:center;padding:25px;color:#d44"><b>دریافت پیام‌ها ناموفق بود</b><p style="font-size:11px;direction:ltr;overflow-wrap:anywhere">${escapeHTML(error.message)}</p><button class="primary" onclick="loadMessages('${targetId}')">تلاش دوباره</button></div>`;
    continue;
   }
   const list=data||[],senderIds=[...new Set(list.map(m=>m.sender_id).filter(Boolean))],replyIds=[...new Set(list.map(m=>m.reply_to).filter(Boolean))];
   let profileMap={},replyMap={};
   if(senderIds.length){
    const {data:profiles,error:profileError}=await db.from('aitel_profiles').select('id,username,display_name,avatar_url,is_verified').in('id',senderIds);
    if(!profileError)(profiles||[]).forEach(p=>profileMap[p.id]=p);
   }
   if(replyIds.length){
    const {data:replies,error:replyError}=await db.from('aitel_messages').select('id,content,sender_id,deleted_at').in('id',replyIds);
    if(!replyError)(replies||[]).forEach(r=>replyMap[r.id]=r);
   }
   list.forEach(m=>{m.sender=profileMap[m.sender_id]||null;m.replyMessage=replyMap[m.reply_to]||null});
   if(currentChat?.id!==targetId)continue;
   messageCache=list;box.innerHTML=list.map(renderMessage).join('')||'<div class="empty">هنوز پیامی ارسال نشده است</div>';
   if(wasNearBottom)box.scrollTop=box.scrollHeight;
  }
 }finally{
  messageLoadRunning=false;if(messageLoadRequested)loadMessages(messageLoadChatId);
 }
}
function renderMessage(m){
 const mine=m.sender_id===currentUser.id,deleted=!!m.deleted_at;
 const sender=m.sender?.display_name||'کاربر ایتل';
 const text=escapeHTML(deleted?'این پیام حذف شده است':m.content||'');
 const linked=deleted?text:text.replace(/@([a-zA-Z0-9_]+)/g,'<span style="color:var(--primary);font-weight:800;cursor:pointer" onclick="findUsername(\'$1\')">@$1</span>');
 let reply='';
 if(m.reply_to){
  const r=m.replyMessage;
  reply=`<div class="replyquote" onclick="scrollToMessage('${m.reply_to}')"><b>پاسخ به پیام</b><span>${escapeHTML(r?.deleted_at?'پیام حذف شده است':r?.content||'پیام اصلی')}</span></div>`;
 }
 let actions='';
 if(!deleted)actions=`<div class="msg-actions"><button onclick="replyMessage('${m.id}')">پاسخ</button>${mine?`<button onclick="editMessage('${m.id}')">ویرایش</button><button onclick="deleteMessage('${m.id}')">حذف</button>`:''}</div>`;
 return `<div class="msg ${mine?'mine':''} ${deleted?'deleted':''}" id="msg-${m.id}">
 ${!mine?`<div class="sender" onclick="${m.sender?.username?`findUsername('${escapeHTML(m.sender.username)}')`:''}">${escapeHTML(sender)}</div>`:''}
 ${reply}<div>${linked}</div>
 <div class="time">${timeText(m.created_at)} ${m.edited_at&&!deleted?'<span class="edited">ویرایش‌شده</span>':''} ${mine?'<span class="ticks">✓</span>':''}</div>${actions}</div>`;
}
function replyMessage(id){
 const msg=messageCache.find(m=>m.id===id);if(!msg)return;
 if(!canSendInCurrentChat()){toast('در این کانال امکان ارسال پاسخ ندارید');return}
 replyTarget=msg;const name=msg.sender_id===currentUser.id?'پیام من':msg.sender?.display_name||'کاربر ایتل';
 $('replyContainer').innerHTML=`<div class="replybar"><div class="replytext"><b>پاسخ به ${escapeHTML(name)}</b>${escapeHTML(msg.content||'')}</div><button onclick="cancelReply()">×</button></div>`;
 $('messageInput')?.focus();
}
function cancelReply(){replyTarget=null;if($('replyContainer'))$('replyContainer').innerHTML=''}
function scrollToMessage(id){
 const el=document.getElementById('msg-'+id);
 if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--primary)';setTimeout(()=>el.style.outline='',1400)}
 else toast('پیام اصلی در این صفحه بارگذاری نشده است');
}
async function editMessage(id){
 const msg=messageCache.find(m=>m.id===id);if(!msg||msg.sender_id!==currentUser.id)return;
 const next=prompt('متن جدید پیام را وارد کنید:',msg.content||'');if(next===null)return;
 const content=next.trim();if(!content){toast('متن پیام نمی‌تواند خالی باشد');return}
 const {data,error}=await db.from('aitel_messages').update({content,edited_at:new Date().toISOString()}).eq('id',id).eq('sender_id',currentUser.id).select().maybeSingle();
 if(error){toast('ویرایش پیام ناموفق بود: '+error.message);return}
 if(!data){toast('پیام ویرایش نشد. دسترسی UPDATE را بررسی کنید.');return}
 toast('پیام ویرایش شد');await loadMessages(currentChat.id);
}
async function deleteMessage(id){
 const msg=messageCache.find(m=>m.id===id);if(!msg||msg.sender_id!==currentUser.id)return;
 if(!confirm('این پیام برای همه حذف شود؟'))return;
 const {data,error}=await db.from('aitel_messages').update({deleted_at:new Date().toISOString(),content:'این پیام حذف شده است'}).eq('id',id).eq('sender_id',currentUser.id).select().maybeSingle();
 if(error){toast('حذف پیام ناموفق بود: '+error.message);return}
 if(!data){toast('پیام حذف نشد. دسترسی UPDATE را بررسی کنید.');return}
 toast('پیام حذف شد');await loadMessages(currentChat.id);
}
async function sendMessage(){
 if(!currentChat||!currentUser)return;
 if(!canSendInCurrentChat()){toast('ارسال پیام در این کانال فقط برای مدیران مجاز است');return}
 const input=$('messageInput');if(!input)return;
 const content=input.value.trim();if(!content)return;
 const chatId=currentChat.id,payload={chat_id:chatId,sender_id:currentUser.id,message_type:'text',content};
 if(replyTarget)payload.reply_to=replyTarget.id;
 input.value='';
 const {error}=await db.from('aitel_messages').insert(payload);
 if(error){if($('messageInput'))$('messageInput').value=content;toast('ارسال پیام ناموفق بود: '+error.message);console.error('SEND MESSAGE ERROR:',error);return}
 cancelReply();await loadMessages(chatId);
}

/* Realtime */
function subscribeAll(){
 if(realtime)db.removeChannel(realtime);
 realtime=db.channel('aitel-global-'+currentUser.id);
 realtime.on('postgres_changes',{event:'*',schema:'public',table:'aitel_messages'},async payload=>{
  const row=payload.new||payload.old,chatId=row?.chat_id;if(!chatId)return;
  if(currentChat?.id===chatId){
   await loadMessages(chatId);
   if(payload.eventType==='INSERT'&&payload.new?.sender_id!==currentUser.id)await markRead(chatId);
  }else{
   await loadUnread();renderList();
   const total=Object.values(unreadMap).reduce((a,b)=>a+b,0);
   if(payload.eventType==='INSERT'&&payload.new?.sender_id!==currentUser.id){notificationCount=total;showNotification(total)}
  }
 })
 .on('postgres_changes',{event:'*',schema:'public',table:'aitel_chat_members',filter:'user_id=eq.'+currentUser.id},async()=>{
  await loadMemberships();await loadChats();await loadUnread();
  if(currentChat){
   const stillMember=!!membershipFor(currentChat.id);
   if(!stillMember&&isChannelChat(currentChat.id,currentChat.type)){toast('عضویت شما در این کانال پایان یافته است');closeChat()}
   else if(isChannelChat(currentChat.id,currentChat.type))refreshComposerPermission();
  }
 })
 .subscribe(status=>{
  console.log('AITEL REALTIME:',status);
  const dot=$('realtimeDot');
  if(dot){dot.classList.toggle('off',status!=='SUBSCRIBED');dot.title=status==='SUBSCRIBED'?'اتصال زنده فعال':'در حال اتصال مجدد'}
  if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('Realtime connection issue:',status);
  if(status==='SUBSCRIBED'&&currentChat)loadMessages(currentChat.id);
 });
}
function refreshComposerPermission(){
 if(!currentChat)return;
 const allowed=canSendInCurrentChat(),composer=document.querySelector('.composer'),readonly=document.querySelector('.readonly');
 if(allowed&&!composer){
  readonly?.remove();const wrap=document.createElement('div');wrap.className='composer';
  wrap.innerHTML=`<input id="messageInput" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"><button class="send" onclick="sendMessage()">${materialIcon('send')}</button>`;
  $('chatArea').appendChild(wrap);
 }else if(!allowed&&composer){
  composer.remove();const wrap=document.createElement('div');wrap.className='readonly';wrap.innerHTML=materialIcon('lock')+' ارسال پیام در این کانال فقط برای مدیران مجاز است.';$('chatArea').appendChild(wrap);
 }
}

/* اعلان‌ها */
async function enableNotifications(){
 if(!('Notification' in window)){toast('مرورگر شما اعلان را پشتیبانی نمی‌کند');return}
 const permission=await Notification.requestPermission();
 toast(permission==='granted'?'اعلان‌ها فعال شدند':'اجازه اعلان داده نشد');
}
function showNotification(count){
 if(!count)return;
 if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
  new Notification('AITEL | ایتل',{body:`شما ${count.toLocaleString('fa-IR')} پیام جدید دارید.`,icon:LOGO_URL});
 }else if(document.hidden)toast(`${count.toLocaleString('fa-IR')} پیام جدید دارید`);
}

/* فهرست کانال‌ها */
function openChannels(){
 let html=`<div class="modalhead"><b>کانال‌های عمومی ایتل</b><button class="iconbtn" onclick="closeModal()">${materialIcon('close')}</button></div>
 <p style="font-size:11px;color:var(--muted)">عضویت در کانال‌ها اختیاری است. کانال رسمی ایتل قابل ترک نیست.</p>`;
 channels.forEach(c=>{
  const joined=!!membershipFor(c.chat_id),official=!!c.is_official;
  html+=`<div class="channelcard">
   <div class="avatar channel-avatar">${official?logoSmall():channelAvatar(c)}</div>
   <div class="details"><b>${escapeHTML(c.title)} ${official?verifiedMark():''}</b>
   <small>${escapeHTML(c.description||'کانال عمومی')}</small>
   ${official?'<small style="color:var(--primary)">کانال رسمی AITEL</small>':`<small>هدف کانال: ${Number(c.target_members||5000).toLocaleString('fa-IR')} عضو</small>`}
   </div>
   ${joined?(official?'<span class="join joined">عضو رسمی</span>':`<button class="dangerbtn" onclick="closeModal();leaveChannel('${c.chat_id}')">ترک کانال</button>`):`<button class="join" onclick="closeModal();joinChannelById('${c.chat_id}')">عضویت</button>`}
  </div>`;
 });
 showModal(html);
}

/* مدیریت پروفایل و گالری */
function openProfile(){
 showModal(`<div class="modalhead"><b>مدیریت پروفایل</b><button class="iconbtn" onclick="closeModal()">${materialIcon('close')}</button></div>
 <div class="profile">
 <div class="avatar" style="width:90px;height:90px;margin:auto;border-radius:25px">${avatarHTML(myProfile)}</div>
 <div style="font-size:11px;color:var(--muted);margin-top:8px">عکس اصلی پروفایل</div>
 <div class="settings-section" style="text-align:right">
 <div class="settings-title">گالری عکس‌های پروفایل</div>
 ${renderPhotoGallery()}
 <label class="upload-label">${materialIcon('add_photo_alternate')} افزودن عکس جدید به پروفایل
 <input id="profilePhotoFiles" type="file" accept="image/*" multiple onchange="uploadProfilePhotos(this.files)">
 </label>
 <div class="photo-note">می‌توانی چندین عکس اضافه کنی. عکس‌های قبلی حذف نمی‌شوند. برای انتخاب عکس اصلی، روی ستاره هر عکس بزن. حداکثر حجم هر عکس ۵ مگابایت است.</div>
 </div>
 <input id="profileName" value="${escapeHTML(myProfile?.display_name||'')}" placeholder="نام نمایشی">
 <input id="profileUsername" value="${escapeHTML(myProfile?.username||'')}" placeholder="نام کاربری">
 <textarea id="profileBio" placeholder="درباره من">${escapeHTML(myProfile?.bio||'')}</textarea>
 <button class="primary profile-action" onclick="saveProfile()">ذخیره تغییرات پروفایل</button>
 <button class="join profile-action" onclick="openSettings()">تنظیمات و ۶۰ تم</button>
 <button class="join profile-action" onclick="enableNotifications()">فعال‌سازی اعلان‌ها</button>
 <button class="join profile-action" onclick="installApp()">افزودن AITEL به صفحه اصلی</button>
 <button class="join profile-action" style="color:#d44" onclick="logout()">خروج از حساب</button>
 </div>`);
}
async function saveProfile(){
 const display_name=$('profileName').value.trim();
 const username=$('profileUsername').value.trim().replace(/^@/,'');
 const bio=$('profileBio').value.trim();
 if(!display_name||!username){toast('نام و نام کاربری را وارد کنید');return}
 if(!/^[a-zA-Z0-9_]{3,30}$/.test(username)){toast('نام کاربری باید حداقل ۳ حرف و فقط شامل حروف انگلیسی، عدد و _ باشد');return}
 const {data,error}=await db.from('aitel_profiles').update({display_name,username,bio,photo_urls:getPhotoList()}).eq('id',currentUser.id).select().single();
 if(error){toast('ذخیره نشد: '+error.message);return}
 myProfile=data;profilePhotos=Array.isArray(data.photo_urls)?data.photo_urls:[];
 $('myName').textContent=data.display_name;$('myUsername').textContent='@'+data.username;$('myAvatar').innerHTML=avatarHTML(data);
 closeModal();toast('پروفایل ذخیره شد');
}
async function logout(){await db.auth.signOut();location.reload()}

/* پروفایل دیگران */
async function openUserProfile(userId){
 let person=Object.values(chatProfiles).find(p=>p?.id===userId);
 if(!person){
  const {data,error}=await db.from('aitel_profiles').select('*').eq('id',userId).maybeSingle();
  if(error||!data){toast('دریافت پروفایل ناموفق بود');return}person=data;
 }
 showUserProfile(person);
}
function showUserProfile(data){
 const photos=[...new Set([data.avatar_url,...(Array.isArray(data.photo_urls)?data.photo_urls:[])].filter(Boolean))];
 showModal(`<div class="modalhead"><b>پروفایل کاربر</b><button class="iconbtn" onclick="closeModal()">${materialIcon('close')}</button></div>
 <div class="profile"><div class="avatar" style="width:90px;height:90px;margin:auto">${avatarHTML(data)}</div>
 <h3>${escapeHTML(data.display_name)} ${data.is_verified?verifiedMark():''}</h3>
 <p style="color:var(--primary)">@${escapeHTML(data.username||'')}</p>
 <p style="font-size:12px;color:var(--muted)">${escapeHTML(data.bio||'')}</p>
 ${photos.length?`<div class="gallery-grid">${photos.map(url=>`<div class="gallery-photo"><img src="${escapeHTML(url)}" alt="عکس پروفایل"></div>`).join('')}</div>`:''}
 <button class="primary" onclick="startDirect('${data.id}','${escapeHTML(data.display_name)}')">ارسال پیام</button></div>`);
}
async function findUsername(username){
 const {data,error}=await db.from('aitel_profiles').select('*').eq('username',username).maybeSingle();
 if(error||!data){toast('کاربری با این نام پیدا نشد');return}showUserProfile(data);
}

/* ساخت پیوی */
async function startDirect(userId,name){
 if(userId===currentUser.id){toast('این پروفایل متعلق به خود شماست');return}
 const {data,error}=await db.rpc('aitel_create_direct_chat',{other_user_id:userId});
 if(error){toast('ساخت گفتگو ناموفق بود: '+error.message);console.error(error);return}
 closeModal();await loadMemberships();await loadChats();
 const chatId=typeof data==='string'?data:data?.chat_id||data?.id;
 if(chatId)await openChat(chatId,name,'direct');else toast('گفتگو ساخته شد اما شناسه آن دریافت نشد');
}

/* اطلاعات گفتگو */
function chatInfo(){
 if(!currentChat)return;
 const channel=channelFor(currentChat.id);
 if(channel){
  if(channel.is_official){
   showModal(`<div class="modalhead"><b>کانال رسمی AITEL</b><button class="iconbtn" onclick="closeModal()">${materialIcon('close')}</button></div>
   <div class="profile"><div class="brandmark" style="margin:auto;width:75px;height:75px;border-radius:23px">${logoSmall()}</div>
   <h3>${escapeHTML(channel.title)} ${verifiedMark()}</h3>
   <p style="font-size:12px;color:var(--muted)">${escapeHTML(channel.description||'کانال رسمی پیام‌رسان ایتل')}</p>
   <span class="join joined">کانال رسمی و تأییدشده</span></div>`);
   return;
  }
  showModal(`<div class="modalhead"><b>اطلاعات کانال</b><button class="iconbtn" onclick="closeModal()">${materialIcon('close')}</button></div>
  <div style="text-align:center;padding:15px">
  <div class="avatar channel-avatar" style="margin:auto">${channelAvatar(channel)}</div>
  <h3>${escapeHTML(channel.title)}</h3><p style="font-size:12px;color:var(--muted)">${escapeHTML(channel.description||'')}</p>
  ${membershipFor(channel.chat_id)?`<button class="dangerbtn" style="width:100%;margin-top:15px" onclick="closeModal();leaveChannel('${channel.chat_id}')">ترک کانال</button>`:''}
  </div>`);
  return;
 }
 const person=chatProfiles[currentChat.id];
 if(person){openUserProfile(person.id);return}
 toast(currentChat.type==='group'?'گروه ایتل':'گفتگوی خصوصی');
}

/* نصب */
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
async function installApp(){
 if(installPrompt){
  installPrompt.prompt();const result=await installPrompt.userChoice;installPrompt=null;
  toast(result.outcome==='accepted'?'درخواست نصب ارسال شد':'نصب لغو شد');
 }else toast('در آیفون: دکمه Share مرورگر را بزنید و Add to Home Screen را انتخاب کنید.');
}

/* بازگشت از پس‌زمینه */
document.addEventListener('visibilitychange',async()=>{
 if(!document.hidden&&currentUser){
  await loadMemberships();await loadUnread();
  if(currentChat){await markRead(currentChat.id);await loadMessages(currentChat.id)}
 }
});

/* راه‌اندازی */
async function startApp(){
 $('login').classList.add('hidden');
 await loadProfile();if(!myProfile)return;
 await loadChannels();await loadMemberships();await loadChats();await loadUnread();
 subscribeAll();renderList();
}
async function boot(){
 await handleOAuth();
 const {data,error}=await db.auth.getSession();if(error)console.error(error);
 if(data.session){currentUser=data.session.user;await startApp()}
 else $('login').classList.remove('hidden');
 db.auth.onAuthStateChange(async(event,session)=>{
  if(session?.user&&!currentUser){currentUser=session.user;await startApp()}
  if(event==='SIGNED_OUT')location.reload();
 });
}
boot();
</script>
