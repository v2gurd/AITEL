<style>
:root{--bg:#f5f6fb;--panel:#fff;--panel2:#f0eff8;--text:#202033;--muted:#9292a8;--primary:#7657e8;--primary2:#a18aff;--border:#e9e8f1;--mine:#7657e8;--mineText:#fff;--shadow:0 12px 40px #24204b12}
*{box-sizing:border-box}
html{touch-action:pan-x pan-y}
body{margin:0;font-family:Vazirmatn,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
button,input,textarea,select{font:inherit;font-size:16px!important}
button{cursor:pointer;touch-action:manipulation}
input,textarea,select{font-size:16px!important}
.app{height:100dvh;display:flex;padding:12px;gap:12px}
.sidebar{width:360px;min-width:300px;background:var(--panel);border:1px solid var(--border);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.brand{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brandname{font-size:26px;font-weight:900;color:var(--primary)}
.brandname span{color:var(--text)}
.iconbtn{border:0;background:var(--panel2);color:var(--text);width:40px;height:40px;border-radius:14px;font-size:18px}
.userbar{display:flex;align-items:center;gap:11px;padding:14px 18px;border-bottom:1px solid var(--border)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;display:grid;place-items:center;font-weight:800;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.userinfo,.chatinfo{flex:1;min-width:0}
.userinfo strong,.chatrow strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{font-size:12px;color:var(--muted)}
.searchbox{margin:13px 15px 8px;background:var(--panel2);border-radius:14px;padding:0 13px;display:flex;align-items:center}
.searchbox input{width:100%;height:43px;background:transparent;border:0;outline:0;color:var(--text)}
.tabs{display:flex;padding:0 14px 10px;gap:7px}
.tab{border:0;border-radius:12px;padding:8px 12px;background:var(--panel2);color:var(--muted);font-size:12px}
.tab.active{background:var(--primary);color:white}
.chatlist{overflow:auto;flex:1;padding:5px 9px}
.chatrow{display:flex;gap:11px;align-items:center;padding:12px 10px;border-radius:16px;cursor:pointer}
.chatrow:hover,.chatrow.active{background:var(--panel2)}
.chatrow .avatar{width:48px;height:48px}
.chatinfo p{font-size:12px;color:var(--muted);margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatmeta{font-size:10px;color:var(--muted)}
.official-row{background:linear-gradient(110deg,color-mix(in srgb,var(--primary) 9%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--primary) 22%,var(--border));margin-bottom:8px}
.official-logo{width:48px;height:48px;border-radius:16px;overflow:hidden;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--primary2))}
.official-logo svg{width:100%;height:100%;display:block}
.verified{display:inline-flex;vertical-align:middle;margin-right:3px;color:#2589ed;font-size:14px;font-weight:900}
.main{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.welcome{margin:auto;text-align:center;padding:25px}
.logo-big{width:90px;height:90px;margin:0 auto 18px;border-radius:30px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;display:grid;place-items:center;font-size:42px;font-weight:900;box-shadow:0 15px 40px #7657e855}
.chatheader{display:none;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border);gap:12px}
.peerinfo{flex:1;min-width:0}
.chatheader strong{display:block}
.chatheader small{color:var(--muted)}
.messages{flex:1;overflow:auto;padding:20px;background-color:var(--bg);background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:35px 35px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:min(75%,600px);padding:10px 13px;border-radius:17px;background:var(--panel);box-shadow:0 3px 12px #00000008;align-self:flex-start;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--mine);color:var(--mineText);border-bottom-right-radius:5px}
.msg:not(.mine){border-bottom-left-radius:5px}
.msg .sender{font-size:11px;font-weight:800;color:var(--primary);margin-bottom:4px}
.msg.mine .sender{color:#ffffffb8}
.msgtime{font-size:10px;color:var(--muted);text-align:left;margin-top:5px}
.msg.mine .msgtime{color:#ffffffa8}
.msg img{max-width:100%;max-height:280px;border-radius:12px;display:block}
.composer{display:none;padding:12px 14px;gap:9px;align-items:flex-end;border-top:1px solid var(--border);background:var(--panel)}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:130px;border:0;outline:0;background:var(--panel2);color:var(--text);border-radius:15px;padding:12px}
.sendbtn{width:46px;height:46px;border:0;border-radius:15px;background:var(--primary);color:white;font-size:20px}
.modaloverlay{display:none;position:fixed;inset:0;background:#100d25a8;z-index:20;align-items:center;justify-content:center;padding:16px}
.modal{width:min(560px,100%);max-height:88dvh;overflow:auto;background:var(--panel);border-radius:23px;padding:20px;box-shadow:var(--shadow)}
.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.modalhead h3{margin:0}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px}
.field textarea{min-height:75px}
.primarybtn{background:var(--primary);color:white;border:0;border-radius:13px;padding:11px 17px;font-weight:700}
.secondarybtn{background:var(--panel2);color:var(--text);border:0;border-radius:13px;padding:10px 14px}
.dangerbtn{background:#e74c6530;color:#d83d55;border:0;border-radius:13px;padding:10px 14px}
.modalactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.themegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.themeitem{border:1px solid var(--border);border-radius:14px;padding:10px;background:var(--panel);color:var(--text);text-align:right;display:flex;align-items:center;gap:10px}
.themeitem.active{outline:2px solid var(--primary)}
.swatches{display:flex;gap:3px}
.swatches i{width:13px;height:28px;border-radius:5px;display:block}
.themefilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.themefilters button{border:0;background:var(--panel2);color:var(--text);padding:7px 10px;border-radius:10px;font-size:11px}
.themefilters button.active{background:var(--primary);color:white}
.login{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{width:min(390px,100%);text-align:center;background:var(--panel);padding:35px 25px;border:1px solid var(--border);border-radius:28px;box-shadow:var(--shadow)}
.googlebtn{width:100%;margin-top:20px;border:1px solid var(--border);border-radius:14px;padding:13px;background:var(--panel);color:var(--text);font-weight:700}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#242238;color:white;padding:11px 18px;border-radius:13px;z-index:90;display:none;font-size:13px;max-width:90%;text-align:center}
.official-profile{text-align:center;padding:15px 5px}
.official-profile .official-logo{width:105px;height:105px;margin:auto;border-radius:30px}
.official-profile h2{margin:12px 0 5px}
.official-profile p{color:var(--muted);line-height:2;font-size:13px}
.profile-stat{background:var(--panel2);border-radius:15px;padding:12px;margin-top:15px;text-align:right;font-size:12px;line-height:2}
.readonly-note{padding:10px 14px;text-align:center;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
.demo-member{display:flex;align-items:center;gap:11px;padding:10px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:12px}
.demo-member:hover{background:var(--panel2)}
.demo-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:800;flex-shrink:0}
.demo-tag{font-size:10px;color:#a18aff;background:#a18aff18;padding:3px 7px;border-radius:8px}
.demo-pagination{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.demo-pagination button{border:0;border-radius:10px;background:var(--panel2);padding:9px 14px;color:var(--text)}
.mention-link{color:#368de9;font-weight:700;cursor:pointer}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:0}
.setting-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.setting-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary)}
.setting-row select{max-width:145px;padding:7px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text)}

.contact-result .avatar{width:40px;height:40px}

.app{padding:0;gap:0}
.sidebar{width:100%;min-width:0;border:0;border-radius:0}
.main{display:none;border:0;border-radius:0}
body.inchat .sidebar{display:none}
body.inchat .main{display:flex}
.chatheader{padding:10px}
.messages{padding:13px}
.msg{max-width:88%}

function openModal(html,locked=false){phoneGate=locked;document.getElementById('modal').innerHTML=html;document.getElementById('modalOverlay').style.display='flex';}
function closeModal(){if(phoneGate)return;document.getElementById('modalOverlay').style.display='none';}
function formatTime(d){return d?new Date(d).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}):'';}
function mix(a,b,r){const x=a.replace('#',''),y=b.replace('#','');return '#'+[0,2,4].map(i=>Math.round(parseInt(x.slice(i,i+2),16)*(1-r)+parseInt(y.slice(i,i+2),16)*r).toString(16).padStart(2,'0')).join('');}
function faNum(n){return Number(n).toLocaleString('fa-IR');}
function normalizeDigits(s=''){return String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));}
function normalizePhone(raw){
 let n=normalizeDigits(raw).replace(/[^\d+]/g,'');
 if(n.startsWith('00'))n='+'+n.slice(2);
 if(n.startsWith('09'))n='+98'+n.slice(1);
 else if(n.startsWith('9')&&n.length===10)n='+98'+n;
 else if(n.startsWith('0')&&n.length>10)n='+'+n.slice(1);
 else if(!n.startsWith('+'))n='+'+n;
 return /^\+[1-9]\d{7,14}$/.test(n)?n:null;
}

/* تم‌ها */
function applyTheme(id,persist=true){
 let i=Math.max(0,Math.min(49,Number(String(id).replace('theme',''))-1)),t=themes[i],root=document.documentElement;
 root.style.setProperty('--bg',t[1]);root.style.setProperty('--panel',t[2]);root.style.setProperty('--primary',t[3]);root.style.setProperty('--primary2',t[4]);root.style.setProperty('--text',t[5]);root.style.setProperty('--panel2',mix(t[1],t[3],.07));root.style.setProperty('--border',mix(t[1],t[5],.10));root.style.setProperty('--mine',t[3]);
 currentTheme='theme'+(i+1);localStorage.setItem('aitel-theme',currentTheme);if(persist&&profile)saveThemePreference(currentTheme);
}
async function saveThemePreference(id){if(!me||!profile)return;const {error}=await sb.from('aitel_profiles').update({theme_id:id}).eq('id',me.id);if(error)toast('ذخیره تم ناموفق بود: '+error.message);else profile.theme_id=id;}
function openThemes(){
 openModal(`<div class="modalhead"><h3>🎨 انتخاب تم</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="themefilters"><button class="active" onclick="filterThemes('all',this)">همه</button><button onclick="filterThemes('light',this)">روشن</button><button onclick="filterThemes('dark',this)">تیره</button></div><div class="themegrid">${themes.map((t,i)=>`<button class="themeitem ${currentTheme==='theme'+(i+1)?'active':''}" data-kind="${isDarkTheme(i)?'dark':'light'}" onclick="applyTheme('theme${i+1}');markTheme(this)"><span class="swatches"><i style="background:${t[1]}"></i><i style="background:${t[3]}"></i><i style="background:${t[4]}"></i></span><span><b>${t[0]}</b><small> تم ${i+1}</small></span></button>`).join('')}</div>`);
}
function isDarkTheme(i){return [8,9,10,11,12,19,20,21,29,30,31,32,33,34,35,43,44,45,46,47,48].includes(i);}
function markTheme(el){document.querySelectorAll('.themeitem').forEach(x=>x.classList.remove('active'));el.classList.add('active');}
function filterThemes(k,b){document.querySelectorAll('.themefilters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.themeitem').forEach(x=>x.style.display=k==='all'||x.dataset.kind===k?'flex':'none');}

async function boot(){
 applyTheme(currentTheme,false);
 const url=new URL(location.href),code=url.searchParams.get('code');
 if(code&&!bootExchangeStarted){
  bootExchangeStarted=true;
  const {error}=await sb.auth.exchangeCodeForSession(code);
  history.replaceState({},document.title,SITE_URL);
  if(error)toast('خطای ورود: '+error.message);
 }
 const {data:{session}}=await sb.auth.getSession();
 if(session)await handleSession(session);
 sb.auth.onAuthStateChange(async(event,session)=>{
  if(session&&(!me||me.id!==session.user.id))await handleSession(session);
  if(event==='SIGNED_OUT')location.reload();
 });
}
async function handleSession(session){
 me=session.user;
 document.getElementById('loginScreen').style.display='none';
 await loadProfile();
 if(!profile)return;
 await loadPrivateSettings();
 if(!privateSettings?.phone_e164){showPhoneSetup();return;}
 await finishAppLoading();
}

/* پروفایل اصلی */
async function loadProfile(){
 let {data,error}=await sb.from('aitel_profiles').select('*').eq('id',me.id).maybeSingle();
 if(error){toast('خطای پروفایل: '+error.message);return;}
 if(!data){
  const name=me.user_metadata?.full_name||me.email?.split('@')[0]||'کاربر ایتل';
  const {data:created,error:e}=await sb.from('aitel_profiles').insert({id:me.id,display_name:name,username:'user_'+me.id.slice(0,8),theme_id:currentTheme}).select().single();
  if(e){toast('ساخت پروفایل: '+e.message);return;}data=created;
 }
 profile=data;
 if(profile.theme_id)applyTheme(profile.theme_id,false);else await saveThemePreference(currentTheme);
 renderMyProfile();
}
function renderMyProfile(){
 if(!profile)return;
 document.getElementById('myName').textContent=profile.display_name||profile.username||'کاربر';
 document.getElementById('myUsername').textContent=profile.username?'@'+profile.username:'حساب ایتل';
 document.getElementById('myAvatar').innerHTML=profile.avatar_url?`<img src="${esc(profile.avatar_url)}">`:esc(initials(profile.display_name));
}
function subscribeProfile(){
 if(profileChannel)sb.removeChannel(profileChannel);
 profileChannel=sb.channel('profile-'+me.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'aitel_profiles',filter:'id=eq.'+me.id},p=>{
  profile=p.new;renderMyProfile();if(profile.theme_id&&profile.theme_id!==currentTheme)applyTheme(profile.theme_id,false);
 }).subscribe();
}

function extractVcfPhones(text){
 const cards=text.split(/BEGIN:VCARD/i).slice(1),out=[];
 for(const card of cards){
  const name=(card.match(/^FN[^:]*:(.*)$/mi)||[])[1]||'مخاطب';
  const lines=card.replace(/\r?\n[ \t]/g,'').split(/\r?\n/);
  for(const line of lines){
   if(/^TEL/i.test(line)){
    const raw=line.split(':').slice(1).join(':').replace(/[^\d+]/g,'');
    const normalized=normalizePhone(raw);
    if(normalized)out.push({name:name.trim(),phone:normalized});
   }
  }
 }
 return [...new Map(out.map(x=>[x.phone,x])).values()].slice(0,500);
}
async function importVcfContacts(){
 const file=document.getElementById('vcfInput')?.files?.[0];
 if(!file)return toast('ابتدا فایل مخاطبین VCF را انتخاب کن.');
 if(!document.getElementById('contactConsent')?.checked)return toast('برای ادامه باید اجازه ارسال مخاطبین را تأیید کنی.');
 const contacts=extractVcfPhones(await file.text());
 if(!contacts.length)return toast('شماره معتبری در فایل پیدا نشد.');
 await matchContacts(contacts);
}
async function pickDeviceContacts(){
 if(!document.getElementById('contactConsent')?.checked)return toast('ابتدا اجازه ارسال مخاطبین را فعال کن.');
 if(!navigator.contacts?.select)return toast('انتخاب مستقیم مخاطبین در این مرورگر پشتیبانی نمی‌شود. در آیفون از فایل VCF استفاده کن.');
 try{
  const selected=await navigator.contacts.select(['name','tel'],{multiple:true});
  const contacts=[];
  selected.forEach(c=>(c.tel||[]).forEach(t=>{const p=normalizePhone(t);if(p)contacts.push({name:(c.name||['مخاطب'])[0],phone:p});}));
  await matchContacts(contacts);
 }catch(e){toast('دسترسی به مخاطبین انجام نشد.');}
}
async function matchContacts(contacts){
 const phones=[...new Set(contacts.map(c=>c.phone))].slice(0,500);
 if(!phones.length)return toast('شماره معتبری برای بررسی وجود ندارد.');
 const box=document.getElementById('contactResults');if(box)box.innerHTML='<p class="muted">در حال جست‌وجو...</p>';
 const {data,error}=await sb.rpc('aitel_match_contacts',{p_phones:phones});
 if(error){if(box)box.innerHTML='';return toast('جست‌وجوی مخاطبین ناموفق بود: '+error.message);}
 contactMatches=data||[];
 if(box)box.innerHTML=contactMatches.length?contactMatches.map(p=>`<div class="contact-result"><div class="avatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc(initials(p.display_name))}</div><div style="flex:1"><b>${esc(p.display_name||p.username)}</b><div class="muted">@${esc(p.username||'')}</div></div><button class="primarybtn" onclick="startDirect('${p.id}')">پیام</button></div>`).join(''):'<p class="muted">هیچ‌کدام از مخاطبینت هنوز در ایتل پیدا نشدند.</p>';
 if(!contactMatches.length)toast('حسابی از مخاطبینت پیدا نشد.');
}

 <div class="official-profile" style="padding:5px">
  <div class="avatar" style="width:76px;height:76px;margin:auto">${profile.avatar_url?`<img src="${esc(profile.avatar_url)}">`:esc(initials(profile.display_name))}</div>

function showAccountInfo(){

 <p class="muted">شماره تلفن در این نسخه با کد پیامکی تأیید نمی‌شود؛ ثبت شماره به معنی تأیید مالکیت آن نیست.</p>`);

/* پروفایل کاربر */
function showProfile(){showSettings();}
function showProfileEditor(){
 openModal(`<div class="modalhead"><h3>ویرایش پروفایل</h3><button class="iconbtn" onclick="showSettings()">‹</button></div>
 <div class="field"><label>نام نمایشی</label><input id="editName" value="${esc(profile.display_name||'')}"></div>
 <div class="field"><label>نام کاربری</label><input id="editUsername" value="${esc(profile.username||'')}"></div>
 <div class="field"><label>درباره من</label><textarea id="editBio">${esc(profile.bio||'')}</textarea></div>
 <div class="field"><label>تصویر پروفایل</label><input type="file" id="avatarFile" accept="image/*"></div>
 <div class="modalactions"><button class="primarybtn" onclick="saveProfile()">ذخیره تغییرات</button><button class="secondarybtn" onclick="showSettings()">بازگشت</button></div>`);
}
async function saveProfile(){
 const display_name=document.getElementById('editName').value.trim(),username=document.getElementById('editUsername').value.trim().replace(/^@/,''),bio=document.getElementById('editBio').value.trim(),file=document.getElementById('avatarFile').files[0];
 if(!/^[a-zA-Z0-9_]{3,24}$/.test(username)){toast('نام کاربری باید ۳ تا ۲۴ حرف انگلیسی، عدد یا زیرخط باشد.');return;}
 let avatar_url=profile.avatar_url;
 if(file){
  const path=me.id+'/'+Date.now()+'.'+(file.name.split('.').pop()||'jpg');
  const {error}=await sb.storage.from(AVATAR_BUCKET).upload(path,file,{upsert:true});
  if(error){toast('آپلود عکس: '+error.message);return;}
  avatar_url=sb.storage.from(AVATAR_BUCKET).getPublicUrl(path).data.publicUrl;
 }
 const {data,error}=await sb.from('aitel_profiles').update({display_name,username,bio,avatar_url}).eq('id',me.id).select().single();
 if(error){toast('ذخیره پروفایل: '+error.message);return;}
 profile=data;renderMyProfile();toast('پروفایل ذخیره شد');showSettings();
}
async function logout(){await sb.auth.signOut();location.reload();}

/* گفتگوها */
async function loadChats(){
 const {data:members,error}=await sb.from('aitel_chat_members').select('chat_id,role').eq('user_id',me.id);
 if(error){toast('خطای عضویت‌ها: '+error.message);return;}
 const roleMap=new Map((members||[]).map(x=>[x.chat_id,x.role])),ids=[...new Set((members||[]).map(x=>x.chat_id))];chats=[];
 if(ids.length){
  const {data,error:e}=await sb.from('aitel_chats').select('id,title,is_group,chat_type,description,is_official,is_verified,created_by,created_at,updated_at').in('id',ids).order('updated_at',{ascending:false});
  if(e){toast('خطای گفتگوها: '+e.message);return;}chats=data||[];
  await Promise.all(chats.map(async c=>{
   c.my_role=roleMap.get(c.id)||'member';
   const {count}=await sb.from('aitel_chat_members').select('*',{count:'exact',head:true}).eq('chat_id',c.id);
   c.member_count=count||0;
   if(c.chat_type==='direct'||(!c.chat_type&&!c.is_group)){
    const {data:m}=await sb.from('aitel_chat_members').select('user_id').eq('chat_id',c.id).neq('user_id',me.id).limit(1).maybeSingle();
    if(m){const {data:p}=await sb.from('aitel_profiles').select('id,display_name,username,avatar_url,is_online,last_seen').eq('id',m.user_id).maybeSingle();c.peer=p||null;}
   }
   const {data:last}=await sb.from('aitel_messages').select('content,message_type,created_at,metadata').eq('chat_id',c.id).is('deleted_at',null).order('created_at',{ascending:false}).limit(1).maybeSingle();
   c.last_message=last;
  }));
 }
 renderChats();
}
function chatTitle(c){if(c.is_official)return officialProfile?.display_name||'AITEL | کانال رسمی';if(c.chat_type==='channel')return c.title||'کانال بدون نام';if(c.is_group)return c.title||'گروه بدون نام';return c.peer?.display_name||c.peer?.username||'گفتگوی خصوصی';}
function renderChats(){
 const list=document.getElementById('chatList'),q=(document.getElementById('chatSearch').value||'').toLowerCase();
 let arr=chats.filter(c=>{
  if(currentFilter==='groups'&&!(c.chat_type==='group'||(c.is_group&&c.chat_type!=='channel')))return false;
  if(currentFilter==='channels'&&c.chat_type!=='channel')return false;
  return chatTitle(c).toLowerCase().includes(q);
 });
 arr.sort((a,b)=>{if(a.is_official&&!b.is_official)return -1;if(!a.is_official&&b.is_official)return 1;return new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at);});
 list.innerHTML=arr.map(c=>{
  const official=!!c.is_official,avatar=official?officialLogoMarkup():`<div class="avatar">${c.peer?.avatar_url?`<img src="${esc(c.peer.avatar_url)}">`:esc(initials(chatTitle(c)))}</div>`,badge=c.is_verified||official?verified():'';
  const preview=c.last_message?.content||(c.chat_type==='channel'?'کانال اطلاع‌رسانی':c.is_group?'گروه ایتل':'گفتگوی جدید');
  return `<div class="chatrow ${currentChat?.id===c.id?'active':''} ${official?'official-row':''}" onclick="selectChat('${c.id}')">${avatar}<div class="chatinfo"><strong>${esc(chatTitle(c))} ${badge}</strong><p>${esc(preview)}</p></div><div class="chatmeta">${formatTime(c.last_message?.created_at||c.updated_at)}</div></div>`;
 }).join('')||'<p class="muted" style="text-align:center;padding:25px">هنوز گفتگویی وجود ندارد.</p>';
}
function setFilter(f,b){currentFilter=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderChats();}

/* انتخاب گفتگو */
async function selectChat(id){
 const c=chats.find(x=>x.id===id);if(!c)return;currentChat=c;
 document.body.classList.add('inchat');document.getElementById('welcome').style.display='none';document.getElementById('chatHeader').style.display='flex';document.getElementById('messages').style.display='flex';
 const isChannel=c.chat_type==='channel',canPost=!isChannel||['owner','admin'].includes(c.my_role);
 document.getElementById('composerArea').style.display=canPost?'flex':'none';document.getElementById('readonlyNote').style.display=canPost?'none':'block';
 document.getElementById('peerName').innerHTML=esc(chatTitle(c))+(c.is_verified||c.is_official?verified():'');
 if(c.is_official){document.getElementById('peerAvatar').innerHTML=officialLogoMarkup();document.getElementById('peerAvatar').style.background='transparent';}
 else{document.getElementById('peerAvatar').innerHTML=c.peer?.avatar_url?`<img src="${esc(c.peer.avatar_url)}">`:esc(initials(chatTitle(c)));document.getElementById('peerAvatar').style.background='';}
 document.getElementById('peerStatus').textContent=isChannel?(c.is_official?'کانال رسمی ایتل · '+faNum(DEMO_MEMBER_COUNT)+' عضو نمایشی':'کانال · '+c.member_count+' عضو'):c.is_group?`${c.member_count} عضو`:(c.peer?.is_online?'آنلاین':'');
 renderChats();await loadMessages();
 if(messageChannel)sb.removeChannel(messageChannel);
 messageChannel=sb.channel('messages-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'aitel_messages',filter:'chat_id=eq.'+id},p=>appendMessage(p.new)).subscribe();
}
function backToChats(){document.body.classList.remove('inchat');}

/* پیام‌ها */
async function loadMessages(){
 const box=document.getElementById('messages');box.innerHTML='';
 const {data,error}=await sb.from('aitel_messages').select('*').eq('chat_id',currentChat.id).is('deleted_at',null).order('created_at',{ascending:true}).limit(200);
 if(error){toast('خطای پیام‌ها: '+error.message);return;}
 for(const m of data||[])await appendMessage(m,false);box.scrollTop=box.scrollHeight;
}
async function mediaUrl(path){if(!path)return null;const {data}=await sb.storage.from(MEDIA_BUCKET).createSignedUrl(path,3600);return data?.signedUrl||null;}
function renderMessageText(text=''){
 let safe=esc(text);
 safe=safe.replace(/(^|[\s(])@([a-zA-Z0-9_]{3,24})\b/g,(match,before,username)=>`${before}<span class="mention-link" data-username="${username}">@${username}</span>`);
 return safe.replace(/\n/g,'<br>');
}
async function appendMessage(m,scroll=true){
 if(!m||!currentChat||m.chat_id!==currentChat.id||document.getElementById('msg-'+m.id))return;
 let content=renderMessageText(m.content||'');
 if(m.message_type==='image'&&m.media_path){const url=await mediaUrl(m.media_path);content=url?`<img src="${esc(url)}">`:'تصویر';}
 else if(m.message_type==='file'&&m.media_path){const url=await mediaUrl(m.media_path);content=`<a href="${esc(url||'#')}" target="_blank">📎 ${esc(m.content||'دریافت فایل')}</a>`;}
 const official=!!m.metadata?.official,mine=m.sender_id===me.id&&!official;
 const el=document.createElement('div');el.className='msg '+(mine?'mine':'');el.id='msg-'+m.id;
 el.innerHTML=(official?`<div class="sender">AITEL ${verified()}</div>`:mine?'<div class="sender">شما</div>':'')+`<div>${content}</div><div class="msgtime">${formatTime(m.created_at)} ${mine?'✓':''}</div>`;
 document.getElementById('messages').appendChild(el);
 if(scroll){const box=document.getElementById('messages');box.scrollTop=box.scrollHeight;}
}
document.getElementById('messages').addEventListener('click',e=>{
 const el=e.target.closest('.mention-link');if(el)openMentionUser(el.dataset.username);
});
async function openMentionUser(username){
 const {data,error}=await sb.from('aitel_profiles').select('id,username,display_name,avatar_url,bio').eq('username',username).maybeSingle();
 if(error||!data){toast('این نام کاربری پیدا نشد.');return;}
 openModal(`<div class="modalhead"><h3>پروفایل کاربر</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="official-profile"><div class="avatar" style="width:90px;height:90px;margin:auto">${data.avatar_url?`<img src="${esc(data.avatar_url)}">`:esc(initials(data.display_name))}</div><h2>${esc(data.display_name||data.username)}</h2><div class="muted">@${esc(data.username)}</div><p>${esc(data.bio||'')}</p><button class="primarybtn" onclick="startDirect('${data.id}')">ارسال پیام</button></div>`);
}
async function sendText(){
 if(!currentChat)return;
 if(currentChat.chat_type==='channel'&&!['owner','admin'].includes(currentChat.my_role)){toast('فقط مدیران کانال می‌توانند پیام ارسال کنند.');return;}
 const input=document.getElementById('messageInput'),content=input.value.trim();if(!content)return;input.value='';
 const {data,error}=await sb.from('aitel_messages').insert({chat_id:currentChat.id,sender_id:me.id,message_type:'text',content}).select().single();
 if(error){input.value=content;toast('ارسال پیام ناموفق بود: '+error.message);return;}await appendMessage(data);
}
async function uploadAndSend(file){
 if(!file||!currentChat)return;
 if(currentChat.chat_type==='channel'&&!['owner','admin'].includes(currentChat.my_role)){toast('فقط مدیران کانال می‌توانند فایل ارسال کنند.');return;}
 if(file.size>20*1024*1024){toast('حداکثر حجم فایل ۲۰ مگابایت است.');return;}
 const path=me.id+'/'+Date.now()+'_'+file.name.replace(/[^\w.-]/g,'_');
 const {error}=await sb.storage.from(MEDIA_BUCKET).upload(path,file);
 if(error){toast('آپلود ناموفق: '+error.message);return;}
 const {data,error:e}=await sb.from('aitel_messages').insert({chat_id:currentChat.id,sender_id:me.id,message_type:file.type.startsWith('image/')?'image':'file',content:file.name,media_path:path,media_mime:file.type,media_size:file.size}).select().single();
 if(e){toast('ارسال فایل ناموفق: '+e.message);return;}await appendMessage(data);
}

/* جست‌وجوی کاربران */
function showNewChat(){openModal(`<div class="modalhead"><h3>گفتگوی جدید</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="field"><input id="userSearch" placeholder="نام یا نام کاربری..." oninput="searchUsers()"></div><div id="userResults"></div>`);}
let searchTimer;
function searchUsers(){clearTimeout(searchTimer);searchTimer=setTimeout(runUserSearch,350);}
async function runUserSearch(){
 const q=document.getElementById('userSearch')?.value.trim(),box=document.getElementById('userResults');if(!q||!box)return;
 const {data,error}=await sb.from('aitel_profiles').select('id,username,display_name,avatar_url').or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').neq('id',me.id).limit(20);
 if(error){box.textContent=error.message;return;}
 profilesCache.clear();(data||[]).forEach(p=>profilesCache.set(p.id,p));
 box.innerHTML=(data||[]).map(p=>`<div class="chatrow" onclick="startDirect('${p.id}')"><div class="avatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc(initials(p.display_name))}</div><div class="chatinfo"><strong>${esc(p.display_name||p.username)}</strong><p>@${esc(p.username||'')}</p></div>＋</div>`).join('')||'<p class="muted">کاربری پیدا نشد.</p>';
}
async function startDirect(otherId){
 const {data,error}=await sb.rpc('aitel_create_direct_chat',{p_other_user:otherId});
 if(error){toast('ساخت گفتگو ناموفق: '+error.message);return;}
 closeModal();await loadChats();const id=typeof data==='string'?data:data?.id||data?.chat_id;if(id)selectChat(id);else toast('گفتگو ساخته شد.');
}

/* ساخت گروه */
function showCreateGroup(){
 openModal(`<div class="modalhead"><h3>ساخت گروه</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="field"><label>نام گروه</label><input id="groupTitle"></div><div class="field"><label>شناسه اعضا با کاما جدا شود</label><input id="groupMembers"></div><button class="primarybtn" onclick="createGroup()">ساخت گروه</button>`);
}
async function createGroup(){
 const title=document.getElementById('groupTitle').value.trim();if(!title)return toast('نام گروه را وارد کن');
 const ids=[...new Set([me.id,...document.getElementById('groupMembers').value.split(',').map(x=>x.trim()).filter(Boolean)])];
 const {data:chat,error}=await sb.from('aitel_chats').insert({title,is_group:true,chat_type:'group',created_by:me.id}).select().single();
 if(error)return toast('ساخت گروه: '+error.message);
 const {error:first}=await sb.from('aitel_chat_members').insert({chat_id:chat.id,user_id:me.id,role:'owner',added_by:me.id});
 if(first)return toast('ثبت مالک گروه ناموفق بود: '+first.message);
 const others=ids.filter(x=>x!==me.id);
 if(others.length){const {error:e}=await sb.from('aitel_chat_members').insert(others.map(user_id=>({chat_id:chat.id,user_id,role:'member',added_by:me.id})));if(e)toast('گروه ساخته شد؛ افزودن برخی اعضا ناموفق بود: '+e.message);}
 closeModal();await loadChats();selectChat(chat.id);toast('گروه ساخته شد');
}

/* ساخت کانال */
function showCreateChannel(){
 openModal(`<div class="modalhead"><h3>ساخت کانال</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="field"><label>نام کانال</label><input id="channelTitle"></div><div class="field"><label>توضیحات</label><textarea id="channelDescription"></textarea></div><button class="primarybtn" onclick="createChannel()">ساخت کانال</button>`);
}
async function createChannel(){
 const title=document.getElementById('channelTitle').value.trim(),description=document.getElementById('channelDescription').value.trim();if(!title)return toast('نام کانال را وارد کن');
 const {data:chat,error}=await sb.from('aitel_chats').insert({title,description,is_group:true,chat_type:'channel',is_official:false,is_verified:false,created_by:me.id}).select().single();
 if(error)return toast('ساخت کانال: '+error.message);
 const {error:e}=await sb.from('aitel_chat_members').insert({chat_id:chat.id,user_id:me.id,role:'owner',added_by:me.id});
 if(e)return toast('عضویت مدیر ثبت نشد: '+e.message);
 closeModal();await loadChats();selectChat(chat.id);toast('کانال ساخته شد');
}

/* اطلاعات گفتگو */
async function chatInfo(){
 if(!currentChat)return;
 if(currentChat.is_official){showOfficialProfile();return;}
 openModal(`<div class="modalhead"><h3>اطلاعات گفتگو</h3><button class="iconbtn" onclick="closeModal()">×</button></div><b>${esc(chatTitle(currentChat))}</b><p class="muted">شناسه: ${esc(currentChat.id)}</p><p>اعضای ثبت‌شده: ${currentChat.member_count||0}</p>${currentChat.chat_type==='channel'?'<p>ارسال پیام فقط برای مدیران کانال فعال است.</p>':''}`);
}

/* اعلان پیام جدید در مرورگر */
function showMessageNotification(m){
 if(!('Notification'in window)||Notification.permission!=='granted'||!privateSettings?.notify_messages)return;
 if(document.visibilityState==='visible')return;
 const title=currentChat?chatTitle(currentChat):'پیام جدید در ایتل';
 try{new Notification(title,{body:m.content||'یک پیام جدید دریافت کردی.',icon:profile?.avatar_url||undefined,tag:'aitel-'+m.id});}catch(e){}
}

/* جلوگیری از زوم ناخواسته در iOS */
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});

boot().catch(e=>toast('خطای راه‌اندازی: '+e.message));
